# Dependabot MikCloud (sécurité S3) — montées de version automatiques
# hebdomadaires pour les trois écosystèmes du monorepo. Les PR restent
# reviewées avant fusion ; les mises à jour patch/minor sont groupées pour
# limiter le bruit. Les mises à jour de sécurité urgentes restent notifiées
# indépendamment de ce planning.
version: 2
updates:
  # Backend Go — API hotspot (Render).
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend Next.js (Vercel) — écosystème « bun » : Dependabot met à jour
  # package.json ET bun.lock. L'ancien écosystème « npm » ne touchait que
  # package.json, laissant bun.lock désynchronisé : la CI
  # (`bun install --frozen-lockfile`) échouait systématiquement
  # (« lockfile had changes, but lockfile is frozen ») — aucune PR npm
  # ne pouvait passer. Audit N°35, 2026-09-05.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 (compilateur natif Go) n'expose plus d'API JavaScript
      # classique (« exports » = stub de version) : typescript-estree — la
      # chaîne ESLint de eslint-config-next — plante au chargement
      # (ts.Extension undefined, PR #13). Le compilateur natif est DÉJÀ
      # adopté via l'alias devDependency `tsgo` (npm:typescript@7.0.2) et le
      # script `typecheck` gate de la CI. Le paquet `typescript` (API JS)
      # reste en 5.x tant que typescript-eslint ne supporte pas TS 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
      # ESLint 10 : la chaîne de plugins d'eslint-config-next 16.3.4 ne le
      # supporte pas encore (état écosystème sept. 2026) — PR #18 fermée.
      # typescript-eslint 8.69 est OK (peer ^10 ajouté, sauvegarde locale
      # validée) MAIS eslint-plugin-react 7.37.5 (latest, peer max ^9.7)
      # plante en runtime avec ESLint 10 (getReactVersionFromContext), et
      # eslint-plugin-react-hooks 7.0.1, eslint-plugin-jsx-a11y 6.10.2,
      # eslint-plugin-import 2.32.0 restent peer ^9 — cinq plugins sur six
      # incompatibles : la PR serait structurellement rouge. Ré-adoption
      # quand eslint-config-next (ou eslint-plugin-react) supportera ESLint 10.
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"

  # Actions GitHub (ci.yml) — sécurité de la chaîne CI elle-même.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
