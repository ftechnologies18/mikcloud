# CI MikCloud — qualité de code sur chaque push / pull request.
# Backend Go : gofmt + go vet + tests + build. Frontend : ESLint + build Next.js.
# Après CI verte sur main : déploiement automatique — Vercel via son propre
# webhook GitHub (fonctionne), Render via le job « deploy-render » ci-dessous
# (le service Render a été créé par API : le webhook Render n'existe pas).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go (gofmt + vet + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vérification du formatage (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Analyse statique (go vet)
        run: go vet ./...

      - name: Tests (go test)
        run: go test -race ./...

      - name: Compilation
        run: go build -o /tmp/mikcloud-server .

  frontend:
    name: Frontend Next.js (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Build (Next.js)
        run: bun run build
        env:
          # Build générique : la vraie URL du backend est injectée par Vercel.
          NEXT_TELEMETRY_DISABLED: 1

  # Sécurité S3 — scan des vulnérabilités Go atteignables (govulncheck,
  # base officielle https://vuln.go.dev). Rapport non bloquant : un échec
  # rend le job rouge (visibilité immédiate) mais n'interrompt pas le
  # déploiement — une fenêtre de hotfix ne doit pas dépendre de la fraîcheur
  # d'une base de CVE externe. Chaque vulnérabilité signalée doit être
  # traitée (montée de version ou justification documentée).
  govulncheck:
    name: Vulnérabilités Go (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Scan des vulnérabilités atteignables
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Tests E2E Playwright (P3-e) — le parcours revendeur complet contre la
  # stack réelle : backend Go (store JSON éphémère) + frontend Next.js de
  # production. Bootstrap par API (project « setup »), puis navigateur :
  # login PIN, pagination du stock, recherche exhaustive, vente tactile,
  # rapport de journée + export CSV comptable. Bloque le déploiement.
  e2e:
    name: E2E Playwright (Mode Vente)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install --frozen-lockfile

      - name: Navigateur Playwright (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Build du frontend (production)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Le build cuit l'URL de l'API : version de test pointant le
          # backend local démarré par le webServer Playwright (jamais déployé).
          NEXT_PUBLIC_API_BASE: http://localhost:4000

      - name: Tests E2E (playwright test)
        run: bunx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Rapport HTML + traces (échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Déploiement du backend Render une fois la CI verte (push main uniquement).
  # Monorepo : seul un changement sous backend/ déclenche le déploiement —
  # un push frontend seul ne redéploie pas l'API.
  # Le service Render (srv-da974o142hec73euul60) ne reçoit pas le webhook
  # GitHub (autoDeploy désactivé côté service) → c'est GitHub Actions qui
  # déclenche le déploiement via l'API.
  # La clé API Render est stockée dans le secret RENDER_API_KEY du dépôt.
  deploy-render:
    name: Déploiement backend Render
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer l'historique (comparaison de commits)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Détecter les changements backend (monorepo)
        id: backend
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          # Nouvelle branche ou commit de référence absent : déploiement
          # par prudence (comportement sûr par défaut).
          if [ -z "$before" ] \
             || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Commit de référence indisponible — déploiement par prudence."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$after" -- backend; then
            echo "Aucun changement sous backend/ — déploiement Render sauté."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend/ modifié — déploiement Render autorisé."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déclencher le déploiement Render
        if: steps.backend.outputs.changed == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "Secret RENDER_API_KEY absent — déploiement Render sauté."
            exit 0
          fi
          ok=""
          for i in 1 2 3 4; do
            resp="$(curl -sS --max-time 20 -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              https://api.render.com/v1/services/srv-da974o142hec73euul60/deploys \
              -d '{}')"
            echo "Tentative ${i} — Réponse Render : ${resp}"
            if echo "${resp}" | grep -q '"id"'; then ok=1; break; fi
            # Réponse vide / refus transitoire (déploiement déjà en cours,
            # 429…) : on attend puis on réessaie.
            echo "Refus transitoire — nouvel essai dans $((i * 10)) s…"
            sleep $((i * 10))
          done
          [ -n "${ok}" ] || { echo "Échec du déclenchement Render après 4 tentatives"; exit 1; }
