# CI MikCloud — qualité de code sur chaque push / pull request.
# Backend Go : gofmt + go vet + build. Frontend : ESLint + build Next.js.
# Après CI verte sur main : déploiement automatique — Vercel via son propre
# webhook GitHub (fonctionne), Render via le job « deploy » ci-dessous
# (le service Render a été créé par API : le webhook Render n'existe pas).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go (vet + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vérification du formatage (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Analyse statique (go vet)
        run: go vet ./...

      - name: Compilation
        run: go build -o /tmp/mikcloud-server .

  frontend:
    name: Frontend Next.js (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Build (Next.js)
        run: bun run build
        env:
          # Build générique : la vraie URL du backend est injectée par Vercel.
          NEXT_TELEMETRY_DISABLED: 1

  # Déploiement du backend Render une fois la CI verte (push main uniquement).
  # Le service Render (srv-da974o142hec73euul60) ne reçoit pas le webhook
  # GitHub → c'est GitHub Actions qui déclenche le déploiement via l'API.
  # La clé API Render est stockée dans le secret RENDER_API_KEY du dépôt.
  deploy-render:
    name: Déploiement backend Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "Secret RENDER_API_KEY absent — déploiement Render sauté."
            exit 0
          fi
          resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-da974o142hec73euul60/deploys \
            -d '{}')"
          echo "Réponse Render : ${resp}"
          echo "${resp}" | grep -q '"id"' || { echo "Échec du déclenchement Render"; exit 1; }
