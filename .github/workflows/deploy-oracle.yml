name: deploy-oracle

# Déploiement du backend vers la VM Oracle Cloud (docs/MIGRATION-ORACLE.md §6).
# Silencieusement ignoré tant que la VM n'est pas raccordée : le pas de
# déploiement exige ORACLE_HOST (env au niveau job — PIÈGE : « secrets »
# n'est PAS autorisé dans un if:, « Unrecognized named-value » au chargement
# du fichier, run en échec SANS aucun job). Avant le raccordement, ce
# workflow vaut CI de build (arch variable) ; une fois raccordé, chaque push main qui
# touche le backend :
#   1. sync les variables Render → /etc/mikcloud/mikcloud.env (§3, idempotent,
#      zéro secret dans le repo, jamais d'écho des valeurs dans les logs)
#      — GELÉ par le sentinel RENDER-DEPLOY-FROZEN depuis le T2 (N°244) :
#      la VM est devenue la source de vérité (secrets rotés par
#      t2-secrets.yml), un sync écraserait les valeurs neuves avec les
#      anciennes valeurs Render ;
#   2. build statique (arch = ORACLE_GOARCH, amd64 sur le pont E5) + scp
#      + systemctl enable+restart + healthcheck.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/oracle/**"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Miroir des secrets pour les if: (secrets interdit dans les if:)
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build (linux, binaire statique — arch cible)
        # ORACLE_GOARCH (repo variable) : amd64 = pont E5.Flex (N°228) ;
        # arm64 = cible finale A1.Flex. Bascule : Settings → Secrets and
        # variables → Actions → Variables → ORACLE_GOARCH=arm64.
        env:
          GOARCH: ${{ vars.ORACLE_GOARCH }}
        run: |
          cd backend
          GOARCH="${GOARCH:-amd64}" CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags "-s -w" -o ../dist/mikcloud-server .

      - name: Notice — VM Oracle pas encore raccordée
        if: env.ORACLE_HOST == ''
        run: |
          echo "::notice::VM Oracle non raccordée (secret ORACLE_HOST absent) — déploiement ignoré. Installation : docs/MIGRATION-ORACLE.md §6."

      # N°244 — GEL DU SYNC (miroir du gel de déploiement N°165 de ci.yml,
      # même sentinel, même fichier racine). Post-T2 la VM est la source de
      # vérité : l'env y a été rotée (t2-secrets.yml — JWT_SECRET épinglé
      # via CREDENTIALS_KEY, DSN Supabase neuf), un sync Render→VM
      # réintroduirait les ANCIENNES valeurs et casserait le backend au
      # redémarrage suivant. Levée du gel : supprimer le sentinel dans un
      # commit de reprise consignée (rollback Render §9.2 uniquement).
      - name: Gel du sync (sentinel RENDER-DEPLOY-FROZEN — N°244)
        id: freeze
        run: |
          if [ -f RENDER-DEPLOY-FROZEN ]; then
            echo "RENDER-DEPLOY-FROZEN présent — sync Render→VM GELÉ (N°244 : la VM est la source de vérité post-T2, l'env y est rotée)."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun gel actif — la source de l'env reste Render (pré-T2)."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync variables Render → VM (/etc/mikcloud/mikcloud.env)
        if: env.ORACLE_HOST != '' && steps.freeze.outputs.frozen != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          # 1. Service backend sur Render (premier service web — le tenancy
          #    n'héberge QUE le backend ; tolère les deux formes de réponse ET
          #    les deux libellés de type : "web" et "web_service" — N°228,
          #    constat : l'API v1 renvoie "web_service", le filtre =="web"
          #    renvoyait null et tuait l'étape en 0,2 s).
          SVC_ID=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services \
            | jq -r '[.[] | (.service // .) | select((.type // "") | startswith("web"))][0].id')
          test -n "$SVC_ID" && test "$SVC_ID" != "null"
          # 2. Variables utilisateur — source de vérité de la prod actuelle.
          #    (réponses Render : entrées {envVar:{...}} ou objets nus)
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SVC_ID/env-vars?limit=100" \
            | jq -r '.[] | (.envVar // .) | select(.key != null) | "\(.key)=\(.value // "")"' \
            | grep -v '^GOMEMLIMIT=' > /tmp/mikcloud.env
          # 3. Ajustements VM (runbook §3) : PORT=4000 (Caddy → 127.0.0.1:4000),
          #    GOMEMLIMIT écarté (le plafond GC 512 Mo de Render n'a plus
          #    d'objet avec 12 Go — §4.2).
          sed -i '/^PORT=/d' /tmp/mikcloud.env
          echo "PORT=4000" >> /tmp/mikcloud.env
          # 4. Dépôt sur la VM — chmod 640 root:mikcloud, aucune valeur échoée.
          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          scp $SSH_OPTS /tmp/mikcloud.env "$DEPLOY_USER@$ORACLE_HOST:/tmp/mikcloud.env.new"
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            # N°274 — migration DB hybride : si la VM exécute le PostgreSQL
            # local (DSN 127.0.0.1), la variable DATABASE_URL de Render NE
            # PRIME PLUS — le re-déploiement CI la PRÉSERVE (sinon un simple
            # déploiement ferait retour silencieux vers Supabase).
            OLD_DSN=$(sudo grep -E ^DATABASE_URL= /etc/mikcloud/mikcloud.env 2>/dev/null)
            case "$OLD_DSN" in
              *127.0.0.1:5432/mikcloud*)
                sed -i "/^DATABASE_URL=/d" /tmp/mikcloud.env.new
                printf "%s\n" "$OLD_DSN" >> /tmp/mikcloud.env.new
                echo "N°274 : DATABASE_URL local préservé (Render ne touche pas la migration hybride)"
                ;;
              *) echo "DSN Render appliqué tel quel (Supabase primaire)";;
            esac
            sudo install -o root -g mikcloud -m 640 /tmp/mikcloud.env.new /etc/mikcloud/mikcloud.env &&
            rm -f /tmp/mikcloud.env.new
          '
          echo "Variables synchronisées (Render -> /etc/mikcloud/mikcloud.env)."

      - name: Déploiement SSH vers la VM
        if: env.ORACLE_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          scp $SSH_OPTS dist/mikcloud-server "$DEPLOY_USER@$ORACLE_HOST:/tmp/mikcloud-server.new"
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            sudo install -m 0755 /tmp/mikcloud-server.new /opt/mikcloud/mikcloud-server &&
            sudo systemctl enable mikcloud &&
            sudo systemctl restart mikcloud &&
            # N°228 — le chargement des ~37 tables Supabase au boot prend
            # ~1 min depuis Johannesburg (piège §10-16) : healthcheck PATIENT
            # (une sonde 3 s après le restart échouait systématiquement).
            i=0 &&
            until curl -fsS -o /dev/null http://127.0.0.1:4000/; do
              i=$((i+1));
              if [ "$i" -ge 60 ]; then
                echo "BACKEND KO après 10 min — journal :" >&2;
                sudo journalctl -u mikcloud -n 30 --no-pager >&2;
                exit 1;
              fi;
              sleep 10;
            done &&
            echo "BACKEND OK (healthcheck au bout de $((i*10)) s)"
          '
