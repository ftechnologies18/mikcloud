name: hunt-a1

# CHASSEUR A1 (N°232) — capture automatique de la capacité ARM nocturne.
# Doctrine N°222 : SONDER d'abord (capacityReports — GRATUIT, hors budget
# anti-429), ne TIRER que si un pool est AVAILABLE. À la capture :
# auto-désactivation (gh workflow disable) + issue d'alerte.
#
# N°241 — CIBLE DE SECOURS VM.Standard.E2.1.Micro (demande de l'exploitant
# « au cas où ») : si les 5 cibles A1 sont rouges et le micro VERT, tir du
# micro (1/8 OCPU, 1 Go — Always Free, AMD x86_64 donc image RÉSOLUE
# dynamiquement, doctrine anti-recopie OCID). Règles :
#   - PRIORITÉ A1 : si un pool A1 est vert, c'est lui qu'on tire (jamais
#     le micro tant qu'une A1 est prenable dans le même passage).
#   - capture micro ≠ fin de chasse : le micro est un filet de secours,
#     le chasseur CONTINUE de chercher l'A1 (garde : une seule capture).
#   - seule la capture A1 désactive le chasseur (mission principale).
#   - le micro porte un nom distinct (mikcloud-micro-bridge) : la garde
#     et land-a1 (qui cherche mikcloud-backend/A1.Flex) restent exacts.
#
# L'instance part avec une IP publique ÉPHÉMÈRE : cloud-init peut télécharger
# bootstrap.sh (fix MTU [0b/8] inclus). L'IP RÉSERVÉE 84.12.85.241 reste sur
# le pont E5 — la production (Render, T1) n'est jamais touchée. L'échange
# éphémère→réservée + GOARCH=arm64 + déploiement = atterrissage land-a1.yml
# (dispatch GitHub, à la session suivant la capture).
#
# Retrait après atterrissage : supprimer les secrets OCI_* de ce dépôt (la
# clé API ne doit vivre que sur le poste de pilotage — doctrine PILOTAGE §1).
on:
  schedule:
    # Fenêtre nocturne JNB (20h-04h UTC), toutes les ~25 min. Minutes hors
    # rondes (charge des runners GitHub — même discipline que keepalive.yml).
    - cron: "11,36 20-23 * * *"
    - cron: "11,36 0-3 * * *"
  workflow_dispatch: {}

concurrency:
  group: hunt-a1
  # Jamais deux chasseurs superposés : un run attend le précédent —
  # double capture impossible côté GitHub.
  cancel-in-progress: false

permissions:
  actions: write # auto-désactivation à la capture
  issues: write  # issue d'alerte à la capture

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      # N°264 — chasse repointée vers la tenancy neuve (eu-marseille-1,
      # trial jusqu'au 05/11/2026) : la tenancy E5 JNB s'éteint le 31/10
      # sans PAYG possible (N°259). Réseau reconstruit à l'identique
      # (VCN 10.0.0.0/16, subnet public 10.0.0.0/24, ingress 22/80/443).
      TEN: ocid1.tenancy.oc1..aaaaaaaawdvtbxs3ck7bsxy5kxmq2lsi6iwt7q6eridqoapw2syrsbl53m6a
      AD: CwKv:EU-MARSEILLE-1-AD-1
      IMG: ocid1.image.oc1.eu-marseille-1.aaaaaaaal5brjyqz2exgmbvinnv6nd6cxn6vzicrowqal5sujz7mnwatuz4a
      SUBNET: ocid1.subnet.oc1.eu-marseille-1.aaaaaaaa4zfxrb4s3avcg4egq465b546t7222j37uwif6cumujzeyd25rfjq
    steps:
      - name: OCI CLI + profil (clé API du coffre GitHub)
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          python3 -m pip install --quiet oci-cli \
            || python3 -m pip install --quiet --break-system-packages oci-cli
          mkdir -p ~/.oci
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          # Poing d'authentification (401 immédiat si un secret manque)
          oci iam region-subscription list --query 'length(data)' --raw-output >/dev/null
          echo "auth OCI OK"

      - name: Garde — A1 déjà capturée ? micro déjà capturé ?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(oci compute instance list --compartment-id "$TEN" --all \
            --query "data[?\"display-name\"=='mikcloud-backend' && \"lifecycle-state\"!='TERMINATED' && shape=='VM.Standard.A1.Flex'] | length(@)" --raw-output 2>/dev/null || echo 1)"
          if [ "$N" != "0" ]; then
            echo "::notice::mikcloud-backend (A1) déjà présente — le chasseur se désactive."
            gh workflow disable hunt-a1.yml
            # N°250 : la capture peut venir du chasseur PARALLÈLE — les
            # deux chasseurs s'éteignent ensemble (croix de désactivation).
            gh workflow disable hunt-parallel.yml || true
            echo "stop=1" >> "$GITHUB_OUTPUT" # bloque aussi sonde/tir (exit 0 seul ne suffit pas)
            exit 0
          fi
          echo "Pas d'A1 en tenancy — la chasse continue."
          # N°241 : comptage du micro de secours (une seule capture voulue).
          M="$(oci compute instance list --compartment-id "$TEN" --all \
            --query "data[?\"display-name\"=='mikcloud-micro-bridge' && \"lifecycle-state\"!='TERMINATED'] | length(@)" --raw-output 2>/dev/null || echo 1)"
          echo "micro=$M" >> "$GITHUB_OUTPUT"
          if [ "$M" != "0" ]; then
            echo "Micro de secours déjà présent — cible #5 retirée du tir (la chasse A1 continue)."
          fi

      - name: Sonde capacité (gratuite — doctrine N°222)
        id: probe
        if: steps.guard.outputs.stop != '1'
        run: |
          cat > /tmp/capreq.json << 'EOF'
          [
            {"instanceShape": "VM.Standard.A1.Flex", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "instanceShapeConfig": {"ocpus": 1.0, "memoryInGBs": 6.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-1", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-2", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-3", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}}
          ]
          EOF
          oci compute compute-capacity-report create --compartment-id "$TEN" \
            --availability-domain "$AD" --shape-availabilities file:///tmp/capreq.json > /tmp/report.json
          jq -r '.data["shape-availabilities"] | to_entries[] | "  cible #\(.key) (\(.value["fault-domain"] // "placement auto")) → \(.value["availability-status"])"' /tmp/report.json
          PICK="$(jq -r '.data["shape-availabilities"] | to_entries[] | select(.value["availability-status"]=="AVAILABLE") | .key' /tmp/report.json | head -1)"
          if [ -n "$PICK" ]; then
            echo "── POOL VERT A1 (cible #$PICK) : TIR prioritaire."
          fi
          # N°241 : sonde micro SÉPARÉE (rapport distinct : une erreur de
          # shape/région sur le micro ne peut jamais casser la sonde A1).
          # Uniquement si l'A1 est rouge et le micro pas déjà capturé.
          MICRO="${{ steps.guard.outputs.micro }}"
          if [ -z "$PICK" ] && [ "$MICRO" = "0" ]; then
            sleep 5 # espacer les deux rapports (ménage le budget anti-429)
            printf '[{"instanceShape": "VM.Standard.E2.1.Micro"}]' > /tmp/microreq.json
            MICRO_OUT="$(oci compute compute-capacity-report create --compartment-id "$TEN" \
              --availability-domain "$AD" --shape-availabilities file:///tmp/microreq.json 2>&1 || true)"
            MSTAT="$(echo "$MICRO_OUT" | jq -r '.data["shape-availabilities"][0]["availability-status"] // empty' 2>/dev/null || true)"
            if [ -z "$MSTAT" ]; then
              MSTAT="PROBE_ERROR"
              echo "  ⚠ sonde micro en échec — raison (3 dernières lignes) :"
              echo "$MICRO_OUT" | grep -vE '^\s*$' | tail -3 | sed 's/^/    /'
            else
              echo "  cible #5 (micro E2.1.Micro) → $MSTAT"
            fi
            if [ "$MSTAT" = "AVAILABLE" ]; then
              PICK=5
              echo "── A1 rouge partout, MICRO VERT : tir du filet de secours (cible #5)."
            fi
          fi
          if [ -z "$PICK" ]; then
            echo "── TOUS ROUGES : la flotte est saturée. Aucun tir (budget préservé)."
          fi
          echo "pick=$PICK" >> "$GITHUB_OUTPUT"

      - name: Tir (si un pool est vert)
        id: fire
        if: steps.probe.outputs.pick != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          PICK="${{ steps.probe.outputs.pick }}"
          case "$PICK" in
            0) SHAPE=VM.Standard.A1.Flex;    NAME=mikcloud-backend;      OCPUS=2.0; MEM=12.0; FD="";;
            1) SHAPE=VM.Standard.A1.Flex;    NAME=mikcloud-backend;      OCPUS=1.0; MEM=6.0;  FD="";;
            2) SHAPE=VM.Standard.A1.Flex;    NAME=mikcloud-backend;      OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-1";;
            3) SHAPE=VM.Standard.A1.Flex;    NAME=mikcloud-backend;      OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-2";;
            4) SHAPE=VM.Standard.A1.Flex;    NAME=mikcloud-backend;      OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-3";;
            5) SHAPE=VM.Standard.E2.1.Micro; NAME=mikcloud-micro-bridge; OCPUS="";   MEM="";   FD="";;
            *) echo "✗ index de cible inconnu : $PICK"; exit 1;;
          esac
          FDARG=()
          [ -n "$FD" ] && FDARG=(--fault-domain "$FD")
          # A1 = shape flexible (config OCPU/RAM) ; micro = shape fixe (rien)
          SHAPEARG=()
          if [ "$SHAPE" = "VM.Standard.A1.Flex" ]; then
            SHAPEARG=(--shape-config "{\"ocpus\":$OCPUS,\"memory-in-gbs\":$MEM}")
          fi
          # Micro = AMD x86_64 : image différente de l'A1 (ARM). Résolution
          # programmatique (doctrine anti-recopie OCID) : dernière Ubuntu
          # 24.04 x86_64 de la plateforme.
          # N°264 — fix : le champ « architecture » est null dans l'API images
          # actuelle — le filtre JMESPath [?architecture=='x86_64'] ne matchait
          # JAMAIS (bug latent : le filet micro n'aurait pas pu tirer).
          # Résolution par jq sur le nom : x86_64 = sans « aarch64 ».
          if [ "$SHAPE" = "VM.Standard.E2.1.Micro" ]; then
            IMG_USE="$(oci compute image list --compartment-id "$TEN" --all \
              --operating-system 'Canonical Ubuntu' --operating-system-version '24.04' \
              --output json | jq -r '[.data[] | select((."display-name"|contains("aarch64"))|not)] | sort_by(."time-created") | .[-1].id // empty')"
            if [ -z "$IMG_USE" ] || [ "$IMG_USE" = "null" ]; then
              echo "✗ image Ubuntu 24.04 x86_64 introuvable (plateforme)"; exit 1
            fi
            echo "image micro (x86_64) : $IMG_USE"
          else
            IMG_USE="$IMG"
          fi
          # Clé publique dérivée du secret privé (la publique n'est pas un secret)
          printf '%s\n' "$SSH_KEY" > /tmp/hunt-key
          chmod 600 /tmp/hunt-key
          ssh-keygen -y -f /tmp/hunt-key > /tmp/hunt-key.pub
          # cloud-init : auto-bootstrap (télécharge bootstrap.sh depuis main —
          # fix MTU [0b/8] N°231 inclus, aucun secret dans ce fichier)
          cat > /tmp/cloud-init.yaml << 'EOF'
          #cloud-config
          runcmd:
            - curl -fsSL https://raw.githubusercontent.com/ftechnologies18/mikcloud/main/deploy/oracle/bootstrap.sh -o /root/bootstrap.sh
            - bash /root/bootstrap.sh api.mikcloud.ftci.fr
          EOF
          echo "── TIR : $NAME ($SHAPE${OCPUS:+, $OCPUS OCPU / $MEM Go}) — ${FD:-placement auto} ──"
          OUT="$(oci compute instance launch \
            --compartment-id "$TEN" --availability-domain "$AD" \
            --display-name "$NAME" --shape "$SHAPE" \
            "${SHAPEARG[@]}" \
            "${FDARG[@]}" \
            --image-id "$IMG_USE" --subnet-id "$SUBNET" \
            --assign-public-ip true \
            --ssh-authorized-keys-file /tmp/hunt-key.pub \
            --user-data-file /tmp/cloud-init.yaml \
            --boot-volume-size-in-gbs 50 \
            --query 'data.id' --raw-output 2>&1 || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q '^ocid1\.instance'; then
            if [ "$SHAPE" = "VM.Standard.E2.1.Micro" ]; then
              echo "micro=$(echo "$OUT" | head -1)" >> "$GITHUB_OUTPUT"
              echo "★★★ MICRO DE SECOURS CAPTURÉ (la chasse A1 continue)"
            else
              echo "a1=$(echo "$OUT" | head -1)" >> "$GITHUB_OUTPUT"
              echo "★★★ CAPTURE ACCEPTÉE"
            fi
          elif echo "$OUT" | grep -q 'Out of host capacity'; then
            echo "::notice::Course perdue (la place a été prise entre la sonde et le tir) — le prochain passage retentera."
            exit 0
          elif echo "$OUT" | grep -q 'TooManyRequests'; then
            echo "::notice::Bride 429 — l'espacement naturel des crons suffit, rien à faire."
            exit 0
          elif [ "$SHAPE" = "VM.Standard.E2.1.Micro" ]; then
            echo "::notice::Échec de lancement du micro (quota ?) — ignoré, la chasse A1 continue."
            exit 0
          else
            echo "✗ erreur de lancement inattendue (voir ci-dessus)"
            exit 1
          fi

      - name: Victoire A1 — issue d'alerte + auto-désactivation
        if: steps.fire.outputs.a1 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A1="${{ steps.fire.outputs.a1 }}"
          EPHEM="$(oci compute instance list-vnics --instance-id "$A1" \
            --query 'data[0]."public-ip"' --raw-output 2>/dev/null || echo '?')"
          gh issue create --title "A1 capturée — prête pour l'atterrissage" --body "$(cat <<EOF
          La capacité ARM s'est libérée et le chasseur a tiré.

          - Instance : \`mikcloud-backend\` (A1.Flex, 50 Go, cloud-init auto-bootstrap avec fix MTU)
          - OCID : \`$A1\`
          - IP publique éphémère de bootstrap : \`$EPHEM\`
          - L'IP réservée 84.12.85.241 RESTE sur le pont E5 — aucun impact production.

          PROCHAINE ÉTAPE : à la session suivante de l'agent, atterrissage
          \`land-a1.yml\` (dispatch GitHub : retrait de l'éphémère, IP
          réservée → A1, ORACLE_GOARCH=arm64, déploiement, santé, puis
          retrait du pont E5 derrière l'input terminate_e5).

          Ce chasseur s'est auto-désactivé. Après atterrissage validé :
          supprimer les secrets OCI_* du dépôt.
          EOF
          )"
          gh workflow disable hunt-a1.yml
          # N°250 : éteindre AUSSI le chasseur parallèle (croix de désactivation).
          gh workflow disable hunt-parallel.yml || true
          echo "Chasseurs (principal + parallèle) désactivés — la capture attend son atterrissage."

      - name: Victoire micro — issue de secours (la chasse A1 continue)
        if: steps.fire.outputs.micro != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MOCID="${{ steps.fire.outputs.micro }}"
          EPHEM="$(oci compute instance list-vnics --instance-id "$MOCID" \
            --query 'data[0]."public-ip"' --raw-output 2>/dev/null || echo '?')"
          gh issue create --title "Micro de secours capturé (E2.1.Micro) — pont AMD en standby, chasse A1 continue" --body "$(cat <<EOF
          L'A1 restait rouge et le micro E2.1.Micro était vert : le filet de
          secours a été capturé (N°241, demande exploitant « au cas où »).

          - Instance : \`mikcloud-micro-bridge\` (VM.Standard.E2.1.Micro, 1/8 OCPU,
            1 Go RAM, 50 Go, Ubuntu 24.04 x86_64, cloud-init auto-bootstrap)
          - OCID : \`$MOCID\`
          - IP publique éphémère : \`$EPHEM\`
          - Coût : Always Free — filet de secours illimité dans le temps.
          - L'IP réservée 84.12.85.241 RESTE sur le pont E5 — aucun impact production.

          La chasse A1 CONTINUE (le micro ne remplace pas l'A1 : 1 Go RAM est
          un pont d'urgence, pas une cible de migration). Utilisation « au cas
          où » : si les crédits E5 expirent (31/10) sans capture A1, le micro
          peut servir de pont de secours minimal (GOARCH=amd64 déjà correct
          pour ce shape) — décision de session, jamais automatique.

          ⚠ Après atterrissage A1 validé : statuer sur le micro (garder en
          standby secondaire ou terminer pour libérer 50 Go de quota).
          EOF
          )"
          echo "Micro sécurisé — le chasseur repart chercher l'A1 au prochain passage."
