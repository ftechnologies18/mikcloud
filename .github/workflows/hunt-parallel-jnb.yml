name: hunt-parallel-jnb

# ═══ CHASSEUR A1 PARALLÈLE — TENANCY JOHANNESBURG « AUTRES FINS » (N°268) ═══
# Transposition JNB du chasseur parallèle N°250 (demande exploitant) : dans
# le cadre du GO « double moteur », CE workflow est le moteur 2 « GitHub » —
# cadence 5 min 24/7 par cron natif, DÉCALÉ de 2 minutes des minutes rondes
# (la boucle E5 v3 dispatche hunt-a1-jnb à :00/:05/:10… → une sonde JNB en
# moyenne toutes les ~2,5 min tant que le pont E5 vit ; après l'épuisement
# des crédits du 31/10, CE chasseur est le survivant permanent — N°267).
#
# Différences vouées avec hunt-parallel.yml (chasse Marseille) :
#   - secrets DÉDIÉS OCI_*_JNB (les OCI_* restent la propriété Marseille) ;
#   - OCIDs JNB restaurés du commit 892ebb4 (N°256, pré-N°264) ;
#   - CIBLE A1 UNIQUEMENT : le filet micro E2.1.Micro reste la propriété du
#     chasseur principal hunt-a1-jnb (N°241) — jamais de double tir micro
#     par construction ;
#   - cible nommée mikcloud-jnb-a1 : la garde ne regarde QUE la tenancy JNB
#     — la production Marseille (autre tenancy) est invisible ;
#   - RE-CONTRÔLE AU TIR : la garde est revérifiée À LA SECONDE du tir —
#     un double lancement mikcloud-jnb-a1 est impossible même en fenêtre
#     de course entre les deux moteurs ;
#   - CROIX DE DÉSACTIVATION JNB : à la victoire (la sienne ou détectée par
#     la garde), CE workflow désactive les DEUX chasseurs JNB — les
#     chasseurs Marseille (hunt-a1.yml / hunt-parallel.yml, disabled
#     N°265) ne sont JAMAIS touchés ; la boucle E5 v3 s'éteint seule en
#     voyant hunt-a1-jnb.yml désactivé.
#
# Doctrine conservée (N°222) : SONDER d'abord (capacity-reports — GRATUIT),
# ne TIRER que si un pool est AVAILABLE. Tir en IP ÉPHÉMÈRE (les IP
# réservées 84.12.85.241 / prod Marseille 84.235.228.160 jamais touchées).
# Cloud-init INERT sur les captures (pas de bootstrap — usage « autres
# fins » à décider par l'exploitant, N°268).
#
# VEILLE ARMÉE : coffre OCI_*_JNB incomplet ou auth en échec → sortie VERT
# avec avis (::notice), aucun tir, aucune notification d'échec — la chasse
# devient réelle dès que Geste 1 (clé API console JNB) + Geste 2 (OCID
# utilisateur) sont faits, sans nouvelle intervention.
#
# Bruit de notifications : les crons internes ne tuent jamais un run en
# cours (cancel-in-progress: false) — même discipline que hunt-parallel.yml.

on:
  schedule:
    # 24/7 toutes les 5 min, décalé de +2 min des minutes rondes (la boucle
    # E5 v3 dispatche hunt-a1-jnb à :00/:05/:10… → sondes entrelacées).
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hunt-parallel-jnb
  # Un seul chasseur parallèle à la fois ; un run qui arrive attend le
  # précédent (aucun tir superposé, aucune annulation de run en cours).
  cancel-in-progress: false

permissions:
  actions: write # auto-désactivation des DEUX chasseurs JNB à la capture
  issues: write  # issue d'alerte à la capture

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # OCIDs JNB restaurés du commit 892ebb4 (N°256, version pré-N°264).
      TEN: ocid1.tenancy.oc1..aaaaaaaa5lipoqjckcohkzca6uc42svliyvuaw7cl33ef5546mhcv4xf7kxq
      AD: yMUP:AF-JOHANNESBURG-1-AD-1
      IMG: ocid1.image.oc1.af-johannesburg-1.aaaaaaaajuezopthnotjmbmvpsii43e7hoxielm74waloedyh6i4qvfiym2a
      SUBNET: ocid1.subnet.oc1.af-johannesburg-1.aaaaaaaanasgo3l7bndnre4ajjcpzfewliekzakfz4c7dhz5zh6ksh7e7caa
      # N°270-bis : `gh` sans checkout (cf. hunt-a1-jnb.yml) — GH_REPO requis
      # pour que les chemins de victoire (issue + désactivation croisée)
      # fonctionnent (preuve : Marseille hunt-a1 #1426 « failed to run git »).
      GH_REPO: ${{ github.repository }}
      # N°270-ter : suppression du Warning OCI CLI (pollution 2>&1 → parse
      # jq — cf. hunt-a1-jnb.yml pour la chaîne complète du diagnostic).
      SUPPRESS_LABEL_WARNING: "True"
    steps:
      - name: OCI CLI + coffre JNB + poing d'auth (veille armée si incomplet)
        id: auth
        env:
          OCI_USER: ${{ secrets.OCI_CLI_USER_JNB }}
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY_JNB }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT_JNB }}
          OCI_REGION: ${{ secrets.OCI_CLI_REGION_JNB }}
          OCI_KEY: ${{ secrets.OCI_API_KEY_JNB }}
        run: |
          if [ -z "$OCI_USER" ] || [ -z "$OCI_TENANCY" ] || [ -z "$OCI_FINGERPRINT" ] || [ -z "$OCI_REGION" ] || [ -z "$OCI_KEY" ]; then
            echo "::notice::[JNB] VEILLE ARMÉE — coffre OCI_*_JNB incomplet (Geste 1 : clé publique à déposer en console JNB ; Geste 2 : OCID utilisateur). Aucun tir, sortie propre."
            exit 0
          fi
          python3 -m pip install --quiet oci-cli \
            || python3 -m pip install --quiet --break-system-packages oci-cli
          mkdir -p ~/.oci
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          # Cohérence clé/empreinte SANS appel API (normalisation deux-points).
          FP_CALC="$(openssl pkey -in ~/.oci/oci_api_key.pem -pubout -outform DER 2>/dev/null | openssl md5 | awk '{print $NF}' | tr -d ':')"
          FP_REF="$(printf '%s' "$OCI_FINGERPRINT" | tr -d ':')"
          if [ "$FP_CALC" != "$FP_REF" ]; then
            echo "::notice::[JNB] VEILLE ARMÉE — empreinte du coffre (${FP_CALC:-introuvable}) ≠ secret fingerprint : clé pas encore déposée en console ou PEM incohérent. Aucun tir."
            exit 0
          fi
          if ! AUTH_OUT="$(oci iam region-subscription list --query 'length(data)' --raw-output 2>&1)"; then
            echo "::notice::[JNB] VEILLE ARMÉE — auth OCI en échec (Geste 1 pas encore effectué côté console ?). Raison(s) détectée(s) :"
            echo "$AUTH_OUT" | grep -oiE 'NotAuthenticated|NotAuthorizedOrNotFound|401|403' | sort -u | sed 's/^/  · /' || echo "  · (raison indéterminée)"
            exit 0
          fi
          echo "auth OCI OK (JNB) — CHASSE ACTIVE."
          echo "ok=1" >> "$GITHUB_OUTPUT" # gate : les étapes suivantes ne tournent QUE si l'auth passe (veille armée = skip propre, run VERT)

      - name: Garde — A1 JNB déjà capturée (par QUI que ce soit) ?
        id: guard
        if: steps.auth.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(oci compute instance list --compartment-id "$TEN" --all \
            --query "data[?\"display-name\"=='mikcloud-jnb-a1' && \"lifecycle-state\"!='TERMINATED' && shape=='VM.Standard.A1.Flex'] | length(@)" --raw-output 2>/dev/null || echo 1)"
          if [ "$N" != "0" ]; then
            echo "::notice::[JNB] mikcloud-jnb-a1 déjà présente — les DEUX chasseurs JNB se désactivent."
            if ! gh issue list --state open --limit 100 --json title -q '.[].title' | grep -qF '[JNB] A1 capturée'; then
              gh issue create --title "[JNB] A1 capturée — usage « autres fins » à définir" --body "Capture détectée par la garde du chasseur PARALLÈLE (N°268). Tenancy JNB « autres fins » — production Marseille invisible et intouchable. Cloud-init inert : usage à décider par l'exploitant. Les deux chasseurs JNB se désactivent ; la boucle E5 s'éteindra d'elle-même."
            fi
            gh workflow disable hunt-parallel-jnb.yml
            gh workflow disable hunt-a1-jnb.yml || true
            echo "stop=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Pas d'A1 en tenancy JNB — la chasse parallèle continue."

      - name: Sonde capacité (gratuite — doctrine N°222)
        id: probe
        if: steps.auth.outputs.ok == '1' && steps.guard.outputs.stop != '1'
        run: |
          cat > /tmp/capreq.json << 'EOF'
          [
            {"instanceShape": "VM.Standard.A1.Flex", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "instanceShapeConfig": {"ocpus": 1.0, "memoryInGBs": 6.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-1", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-2", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}},
            {"instanceShape": "VM.Standard.A1.Flex", "faultDomain": "FAULT-DOMAIN-3", "instanceShapeConfig": {"ocpus": 2.0, "memoryInGBs": 12.0}}
          ]
          EOF
          oci compute compute-capacity-report create --compartment-id "$TEN" \
            --availability-domain "$AD" --shape-availabilities file:///tmp/capreq.json > /tmp/report.json
          jq -r '.data["shape-availabilities"] | to_entries[] | "  cible #\(.key) (\(.value["fault-domain"] // "placement auto")) → \(.value["availability-status"])"' /tmp/report.json
          PICK="$(jq -r '.data["shape-availabilities"] | to_entries[] | select(.value["availability-status"]=="AVAILABLE") | .key' /tmp/report.json | head -1)"
          if [ -n "$PICK" ]; then
            echo "── POOL VERT A1 JNB (cible #$PICK) : TIR prioritaire."
          else
            echo "── TOUS ROUGES : la flotte est saturée. Aucun tir (budget préservé)."
          fi
          echo "pick=$PICK" >> "$GITHUB_OUTPUT"

      - name: Tir (re-contrôle de garde à la seconde près, puis lancement)
        id: fire
        if: steps.auth.outputs.ok == '1' && steps.probe.outputs.pick != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          PICK="${{ steps.probe.outputs.pick }}"
          # ── RE-CONTRÔLE (spécifique chasse parallèle, N°250) ──
          # Le chasseur principal (boucle E5 v3 ou cron nocturne) a pu
          # capturer entre notre sonde et maintenant : si une A1 JNB existe
          # déjà, on s'arrête NET — pas de double mikcloud-jnb-a1 possible.
          N="$(oci compute instance list --compartment-id "$TEN" --all \
            --query "data[?\"display-name\"=='mikcloud-jnb-a1' && \"lifecycle-state\"!='TERMINATED'] | length(@)" --raw-output 2>/dev/null || echo 1)"
          if [ "$N" != "0" ]; then
            echo "::notice::A1 JNB apparue entre la sonde et le tir (autre moteur plus rapide) — abandon propre du tir."
            if ! gh issue list --state open --limit 100 --json title -q '.[].title' | grep -qF '[JNB] A1 capturée'; then
              gh issue create --title "[JNB] A1 capturée — usage « autres fins » à définir" --body "Capture détectée par le re-contrôle du chasseur PARALLÈLE au moment du tir (N°268). Les deux chasseurs JNB se désactivent ; la boucle E5 s'éteindra d'elle-même."
            fi
            gh workflow disable hunt-parallel-jnb.yml
            gh workflow disable hunt-a1-jnb.yml || true
            echo "a1=deja-capturee" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PICK" in
            0) SHAPE=VM.Standard.A1.Flex; NAME=mikcloud-jnb-a1; OCPUS=2.0; MEM=12.0; FD="";;
            1) SHAPE=VM.Standard.A1.Flex; NAME=mikcloud-jnb-a1; OCPUS=1.0; MEM=6.0;  FD="";;
            2) SHAPE=VM.Standard.A1.Flex; NAME=mikcloud-jnb-a1; OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-1";;
            3) SHAPE=VM.Standard.A1.Flex; NAME=mikcloud-jnb-a1; OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-2";;
            4) SHAPE=VM.Standard.A1.Flex; NAME=mikcloud-jnb-a1; OCPUS=2.0; MEM=12.0; FD="FAULT-DOMAIN-3";;
            *) echo "✗ index de cible inconnu : $PICK"; exit 1;;
          esac
          FDARG=()
          [ -n "$FD" ] && FDARG=(--fault-domain "$FD")
          printf '%s\n' "$SSH_KEY" > /tmp/hunt-key
          chmod 600 /tmp/hunt-key
          ssh-keygen -y -f /tmp/hunt-key > /tmp/hunt-key.pub
          # cloud-init VOLONTAIREMENT INERT (N°268) — hostname + marqueur,
          # AUCUN bootstrap, AUCUN secret.
          cat > /tmp/cloud-init.yaml << EOF
          #cloud-config
          hostname: $NAME
          write_files:
            - path: /etc/update-motd.d/95-mikcloud-jnb
              permissions: '0755'
              content: |
                #!/bin/sh
                echo " MIKCLOUD — instance capturée par la chasse JNB (double moteur, N°268)."
                echo " Usage « autres fins » : à définir par l'exploitant (cloud-init volontairement inert)."
          runcmd:
            - touch /root/.mikcloud-jnb-capture
          EOF
          echo "── TIR (parallèle JNB) : mikcloud-jnb-a1 ($SHAPE, $OCPUS OCPU / $MEM Go) — ${FD:-placement auto} ──"
          OUT="$(oci compute instance launch \
            --compartment-id "$TEN" --availability-domain "$AD" \
            --display-name mikcloud-jnb-a1 --shape "$SHAPE" \
            --shape-config "{\"ocpus\":$OCPUS,\"memory-in-gbs\":$MEM}" \
            "${FDARG[@]}" \
            --image-id "$IMG" --subnet-id "$SUBNET" \
            --assign-public-ip true \
            --ssh-authorized-keys-file /tmp/hunt-key.pub \
            --user-data-file /tmp/cloud-init.yaml \
            --boot-volume-size-in-gbs 50 \
            --query 'data.id' --raw-output 2>&1 || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q '^ocid1\.instance'; then
            echo "a1=$(echo "$OUT" | head -1)" >> "$GITHUB_OUTPUT"
            echo "★★★ CAPTURE ACCEPTÉE (chasse parallèle JNB)"
          elif echo "$OUT" | grep -q 'Out of host capacity'; then
            echo "::notice::Course perdue (la place a été prise entre la sonde et le tir) — le prochain passage retentera."
            exit 0
          elif echo "$OUT" | grep -q 'TooManyRequests'; then
            echo "::notice::Bride 429 — l'espacement naturel des crons suffit, rien à faire."
            exit 0
          elif echo "$OUT" | grep -q 'LimitExceeded'; then
            echo "::notice::Quota Always Free déjà consommé dans la tenancy — la garde re-vérifiera au prochain passage."
            exit 0
          else
            echo "✗ erreur de lancement inattendue (voir ci-dessus)"
            exit 1
          fi

      - name: Victoire A1 JNB — issue d'alerte + désactivation des DEUX chasseurs JNB
        if: steps.auth.outputs.ok == '1' && steps.fire.outputs.a1 != '' && steps.fire.outputs.a1 != 'deja-capturee'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A1="${{ steps.fire.outputs.a1 }}"
          EPHEM="$(oci compute instance list-vnics --instance-id "$A1" \
            --query 'data[0]."public-ip"' --raw-output 2>/dev/null || echo '?')"
          gh issue create --title "[JNB] A1 capturée — usage « autres fins » à définir" --body "$(cat <<EOF
          La capacité ARM s'est libérée dans la tenancy **Johannesburg** et le
          chasseur PARALLÈLE (moteur 2 « GitHub », N°268) a tiré avant le
          chasseur principal.

          - Instance : \`mikcloud-jnb-a1\` (A1.Flex ≤ 2 OCPU/12 Go, 50 Go, cloud-init INERT)
          - OCID : \`$A1\`
          - IP publique éphémère de bootstrap : \`$EPHEM\`
          - La production Marseille (autre tenancy) est **invisible et intouchable**.
          - Survie : Always Free — la capture survive à la fin du trial SANS PAYG (N°267).

          USAGE : « à d'autres fins » — décision de l'exploitant (instance vierge).

          Les DEUX chasseurs JNB (hunt-parallel-jnb + hunt-a1-jnb) se désactivent ;
          la boucle du pont E5 s'éteindra d'elle-même en constatant l'extinction.
          EOF
          )"
          gh workflow disable hunt-parallel-jnb.yml
          gh workflow disable hunt-a1-jnb.yml || true
          echo "Chasseurs JNB désactivés — la capture attend sa destination."
