name: ops-db-hybrid

# ═══ MIGRATION DB HYBRIDE — POSTGRESQL CO-HÉBERGÉ « Ftechci » (N°274) ═══
#
# Exécution de la décision exploitant « Lance la migration hybride DB » :
# le PG primaire quitte Supabase (Dublin, pooler) pour PostgreSQL 17
# co-hébergé sur la VM Ftechci (Marseille, 4 OCPU / 24 Go — N°272/273),
# dans l'architecture à 4 étages de durabilité (Task 6) :
#
#   Tier0  mémoire model.DB (RPO 0, backend vivant — inchangé)
#   Tier1  PostgreSQL 17 local (PRIMAIRE, socket localhost, scram)
#   Tier1.5 archivage WAL local → /var/backups/mikcloud/wal (PITR futur,
#          l'upload Object Storage arrive en N°275)
#   Tier2  Supabase → fallback chaud (figé au cutover, re-synchronisé
#          la nuit en N°275 — reverse-sync)
#   Tier3  artefact GitHub chiffré (BACKUP_KEY, AES-256-CBC/PBKDF2)
#
# PIÈGES CONSIGNÉS REPRIS (backup-neon.sh N°243) :
#   - pg_dump exige le pooler SESSION de Supabase (:5432) — celui du
#     backend (transaction, :6543) refuse pg_dump ;
#   - pg_dump ≥ version serveur Supabase (17.6) → le client 17 PGDG est
#     déjà installé sur la VM (le timer mikcloud-backup l'exige) ;
#   - --schema=public impératif (les schémas plateforme Supabase ne sont
#     ni restaurables hors Supabase ni désirables) ;
#   - dump en DEUX PHASES (fichier, jamais de pipe entre les deux bases) ;
#
# SÉCURITÉ DU CUTOVER (mode=cutover) :
#   - confirmation explicite `confirm=MIK-DB-HYBRID` ;
#   - dump/restore DELTA intégré au cutover (le backend continue sur
#     Supabase pendant le refresh du local) — sinon les minutes entre un
#     backup et le flip seraient perdues au restart (Load() du local) ;
#   - perte résiduelle bornée : ≤ 3 s de flush coalescé vers Supabase au
#     SIGTERM (convergences mémoire après : last_seen 45-180 s,
#     read_state ≥ 2 min) ;
#   - PREUVES DE BASCULE obligatoires : journalctl « persistance
#     PostgreSQL active » (le mode dégradé masquerait une DB morte) +
#     écritures réelles mesurées (pg_stat_database.tup_updated) ;
#   - ROLLBACK AUTOMATIQUE (env .pre-hybrid-* restauré, restart,
#     healthcheck) sur tout signe anormal ;
#   - timer mikcloud-backup STOPPÉ au cutover (il recopierait Supabase
#     figé vers Neon et écraserait le coffre avec des données périmées) ;
#   - BLINDAGE deploy-oracle (même push) : le re-déploiement CI ne
#     ré-écrase plus DATABASE_URL de la VM.
#
# RÉVERSIBILITÉ : mode=rollback re-flip vers Supabase (avec garde
# accept_stale_data=YES — Supabase est figé depuis le cutover).
# STATUT PERSISTANT : mode=status (drift local/Supabase, tailles, WAL,
# dernier dump, santé backend).
#
# ═══ CONSOLIDATION DR — N°275 ═══
#
# Exécution du GO exploitant « GO N°275 » (runbook docs/DB-HYBRIDE.md §5) :
#
#   arm-dr  (confirm=MIK-DR-ARM) — arme la chaîne DR sur la VM :
#           · archive_command passe en gzip (le WAL 16 Mo/min creusait
#             ~17 Go/jour de disque — le gzip divise par ~50) ;
#           · OCI CLI + config /etc/oci (clé API du coffre) ; bucket
#             mikcloud-wal + lifecycle 21 jours ;
#           · script mikcloud-wal-upload (timer */5 min) — Tier1.5 :
#             WAL → OCI Object Storage, prune locale après upload ;
#           · script mikcloud-reverse-sync (timer 03:00 UTC) — Tier2 :
#             rétention web_vitals → base backup PITR → dump local →
#             restore Supabase (--clean, RLS ré-armé) → restore Neon ;
#           · script mikcloud-monitor (timer */15 min) — alertes
#             Telegram (bot plateforme, chat = plus ancien compte
#             notif_settings telegram activé), heartbeat 06:00 UTC ;
#           · unités systemd idempotentes.
#   reverse-sync — déclenche le flux nocturne immédiatement (validation
#           manuelle sans attendre 03:00).
#   health  — lance le monitor une fois + contrôle API publique ; c'est
#           aussi le mode par défaut du cron GitHub quotidien (04:23 UTC).
#   drill   — démontre la restaurabilité : dump primaire → restore
#           strict sur base de drill mikcloud_drill → asserts → drop,
#           + lisibilité d'un segment WAL du bucket (pg_waldump).
#
# SÉCURITÉ :
#   - arm-dr exige confirm=MIK-DR-ARM (pose des credentials OCI sur la
#     VM + création de bucket + timers) — rien d'irréversible, tout
#     idempotent, mais c'est un geste d'infrastructure ;
#   - reverse-sync ne touche JAMAIS le primaire (dump + rétention
#     DELETE > 90 jours web_vitals uniquement) ;
#   - drill tourne sur mikcloud_drill (base jetable), jamais sur
#     mikcloud.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit | backup | setup-pg | restore | cutover | rollback | status | arm-dr | reverse-sync | health | drill"
        required: true
        type: string
      confirm:
        description: "Taper MIK-DB-HYBRID pour cutover / rollback — MIK-DR-ARM pour arm-dr"
        required: false
        default: ""
        type: string
      accept_stale_data:
        description: "(rollback) Taper YES si Supabase figé est acceptable"
        required: false
        default: ""
        type: string
      dump_file:
        description: "(restore) nom du dump dans /var/backups/mikcloud/db — défaut = le plus récent"
        required: false
        default: ""
        type: string
  schedule:
    # Heartbeat quotidien : mode=health (le resolver ci-dessous traduit un
    # event schedule sans input en mode health).
    - cron: "23 4 * * *"

concurrency:
  group: ops-db-hybrid
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      VM_HOST: ${{ secrets.ORACLE_HOST }}
      DEPLOY_USER: ${{ secrets.ORACLE_USER }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      # N°275 — credentials OCI tenancy Marseille (upload WAL → Object
      # Storage, bucket mikcloud-wal) — même coffre que les chasses.
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      ACCEPT_STALE: ${{ inputs.accept_stale_data }}
      DUMP_FILE: ${{ inputs.dump_file }}
    steps:
      - name: Clé SSH du coffre + preflight VM
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          chmod 600 /tmp/oracle_key
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" 'echo "SSH OK — $(hostname) — $(date -u +%FT%TZ)"'
          # N°275 : les étapes filtrent sur RESOLVED_MODE (schedule → health)
          RESOLVED_MODE="$MODE"
          [ -n "$RESOLVED_MODE" ] || RESOLVED_MODE=health
          echo "RESOLVED_MODE=$RESOLVED_MODE" >> "$GITHUB_ENV"
          echo "MODE=$RESOLVED_MODE · cible=$VM_HOST"

      - name: mode=audit — inventaire complet (lecture seule)
        if: ${{ env.RESOLVED_MODE == 'audit' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE' | tee /tmp/audit.txt
          set -euo pipefail
          echo "═══ 1. Système ═══"
          uname -sr; uptime
          free -h | sed -n '1,2p'
          df -h / /var 2>/dev/null | sed -n '1,3p'
          echo "═══ 2. Services mikcloud ═══"
          systemctl is-active mikcloud && echo "mikcloud: ACTIF" || echo "mikcloud: INACTIF"
          curl -fsS -o /dev/null -w "backend HTTP %{http_code} (%{time_total}s)\n" http://127.0.0.1:4000/ || echo "backend: KO"
          systemctl list-timers --no-pager 2>/dev/null | grep -i mikcloud || echo "timer mikcloud-backup: absent"
          echo "═══ 3. Clés de /etc/mikcloud (VALEURS JAMAIS IMPRIMÉES) ═══"
          sudo grep -cE '^[A-Z_]+=' /etc/mikcloud/mikcloud.env | xargs echo "mikcloud.env: clés ="
          sudo cut -d= -f1 /etc/mikcloud/mikcloud.env | tr '\n' ' '; echo
          sudo test -f /etc/mikcloud/backup.env && { echo "backup.env: présent"; sudo cut -d= -f1 /etc/mikcloud/backup.env | tr '\n' ' '; echo; } || echo "backup.env: ABSENT"
          echo "═══ 4. PostgreSQL local ═══"
          pg_dump --version 2>/dev/null || echo "pg_dump: absent"
          psql --version
          pg_lsclusters 2>/dev/null || true
          ls /etc/postgresql/ 2>/dev/null || echo "aucun cluster"
          echo "═══ 5. PGDG ═══"
          ls /etc/apt/sources.list.d/ 2>/dev/null | grep -i pgdg || echo "PGDG: absent"
          echo "═══ 6. Hosts DB dans les env (sans credentials) ═══"
          sudo grep -E '^(DATABASE_URL|DATABASE_URL_SESSION)=' /etc/mikcloud/mikcloud.env /etc/mikcloud/backup.env 2>/dev/null \
            | sed -E 's|//[^@/]*@|//***@|; s|\?.*||' || true
          echo "═══ 7. Connexion Supabase + comptages (schéma public) ═══"
          if sudo test -f /etc/mikcloud/backup.env; then
            set -a; . <(sudo cat /etc/mikcloud/backup.env); set +a
          fi
          if [ -n "${DATABASE_URL_SESSION:-}" ]; then
            psql "$DATABASE_URL_SESSION" -Atc "select version()" | head -1
            Q=$(psql "$DATABASE_URL_SESSION" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
            psql "$DATABASE_URL_SESSION" -At -c "$Q" | sort > /tmp/counts_supabase.txt
            echo "tables: $(wc -l < /tmp/counts_supabase.txt) — lignes: $(awk -F'|' '{s+=$2} END {print s}' /tmp/counts_supabase.txt)"
            echo "--- comptages (table lignes) ---"
            cat /tmp/counts_supabase.txt
            sudo install -D -m 644 /tmp/counts_supabase.txt /var/backups/counts-supabase-last.txt
          else
            echo "DATABASE_URL_SESSION introuvable — comptages sautés"
          fi
          echo "═══ AUDIT TERMINÉ (aucune modification) ═══"
          REMOTE

      - name: mode=backup — dump DR primaire local + artefact chiffré
        if: ${{ env.RESOLVED_MODE == 'backup' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          STAMP=$(ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" 'date -u +%Y%m%dT%H%M%SZ')
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<REMOTE
          set -euo pipefail
          STAMP="$STAMP"
          rm -f /tmp/dbhybrid.env
          sudo install -d -o "\$USER" -m 755 /var/backups/mikcloud/db
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          : "\${LOCALPG_DSN:?localpg.env incomplet}"
          DUMP=/var/backups/mikcloud/db/primary-\$STAMP.dump
          echo "pg_dump primaire LOCAL → \$DUMP (schéma public, format custom)…"
          pg_dump --schema=public --no-owner --no-privileges -Fc -f "\$DUMP" "\$LOCALPG_DSN"
          [ -s "\$DUMP" ] || { echo "DUMP VIDE — échec"; exit 1; }
          TABLES=\$(pg_restore --list "\$DUMP" | grep -c ' TABLE ' || true)
          echo "TOC ok — \$TABLES tables dans le dump"
          [ "\$TABLES" -ge 30 ] || { echo "TOC SUSPECTE (<30 tables) — échec"; exit 1; }
          sudo chmod 644 "\$DUMP"
          sha256sum "\$DUMP" | tee "\$DUMP.sha256"
          ls -la /var/backups/mikcloud/db/ | tail -5
          # copie lisible par le runner pour l'artefact chiffré
          sudo cp "\$DUMP" /tmp/supabase-dr.dump
          sudo chown \$USER /tmp/supabase-dr.dump
          echo "DUMP_PATH=/tmp/supabase-dr.dump" >> /tmp/dbhybrid.env
          echo "STAMP=\$STAMP" >> /tmp/dbhybrid.env
          REMOTE
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" 'cat /tmp/dbhybrid.env' > /tmp/dbhybrid.env
          source /tmp/dbhybrid.env
          scp $SSH_OPTS "$DEPLOY_USER@$VM_HOST:/tmp/supabase-dr.dump" /tmp/supabase-dr.dump
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" 'rm -f /tmp/supabase-dr.dump /tmp/dbhybrid.env'
          # chiffrement artefact (Tier3) — BACKUP_KEY du coffre (hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in /tmp/supabase-dr.dump -out /tmp/supabase-dr.dump.enc \
            -pass env:BACKUP_KEY
          echo "::add-mask::${{ secrets.BACKUP_KEY }}"
          sha256sum /tmp/supabase-dr.dump /tmp/supabase-dr.dump.enc
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          rm -f /tmp/supabase-dr.dump
      - name: Upload artefact DR chiffré (rétention 30 j)
        if: ${{ env.RESOLVED_MODE == 'backup' }}
        uses: actions/upload-artifact@v4
        with:
          name: mikcloud-dr-${{ env.STAMP }}
          path: /tmp/supabase-dr.dump.enc
          retention-days: 30

      - name: mode=setup-pg — PostgreSQL 17 local calibré 4/24
        if: ${{ env.RESOLVED_MODE == 'setup-pg' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          echo "═══ 1. Installation PostgreSQL serveur (VM Ubuntu 26.04 → PG 18) ═══"
          if ! ls /etc/postgresql/*/main/PG_VERSION >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-18 \
              || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-17
          else
            echo "un serveur PostgreSQL est déjà installé"
          fi
          PV=$(ls /etc/postgresql/ | head -1)
          echo "version serveur: $PV — client: $(psql --version)"
          sudo systemctl enable --now postgresql@${PV}-main
          echo "═══ 2. Répertoire WAL (Tier1.5 local) ═══"
          sudo install -d -o postgres -g postgres -m 700 /var/backups/mikcloud/wal
          echo "═══ 3. Config calibrée Ftechci 4/24 ═══"
          sudo tee /etc/postgresql/$PV/main/conf.d/mikcloud.conf > /dev/null <<'PGCONF'
          # ─── mikcloud — calibrage Ftechci 4 OCPU / 24 Go (N°274) ───
          # Primaire co-hébergé : localhost UNIQUEMENT (aucun port public ;
          # le Security List OCI ne passe déjà que 80/443/22).
          listen_addresses = 'localhost'
          max_connections = 60            # backend (4+2) + télémétrie (2+1) + outils + marge multi-services
          # Mémoire (24 Go partagés avec backend Go ~50 Mo, Caddy, services futurs)
          shared_buffers = 4GB
          effective_cache_size = 12GB
          work_mem = 16MB
          maintenance_work_mem = 256MB
          # WAL / checkpoints ( écritures coalescées ≤1 tx/3 s — charge faible)
          wal_buffers = 16MB
          min_wal_size = 256MB
          max_wal_size = 2GB
          checkpoint_completion_target = 0.9
          # Tier1.5 — archivage WAL local (upload Object Storage en N°275)
          archive_mode = on
          archive_command = 'test ! -f /var/backups/mikcloud/wal/%f && cp %p /var/backups/mikcloud/wal/%f'
          archive_timeout = 60s           # RPO ≤ 1 min côté WAL
          # Statistiques
          shared_preload_libraries = 'pg_stat_statements'
          pg_stat_statements.max = 10000
          pg_stat_statements.track = all
          # Observabilité
          log_checkpoints = on
          log_autovacuum_min_duration = 1s
          log_min_duration_statement = 500
          # Autovacuum (purges admin DELETE ×500 sans VACUUM — incident N°157)
          autovacuum_max_workers = 6
          autovacuum_naptime = 30s
          PGCONF
          echo "═══ 4. Redémarrage cluster (preload) ═══"
          sudo systemctl restart postgresql@${PV}-main
          sleep 2
          pg_isready -h 127.0.0.1 -p 5432
          echo "═══ 5. Rôle + base + extension ═══"
          if ! sudo test -f /etc/mikcloud/localpg.env; then
            PASS=$(openssl rand -hex 24)
            sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='mikcloud') THEN
              CREATE ROLE mikcloud LOGIN PASSWORD '$PASS';
            ELSE
              ALTER ROLE mikcloud LOGIN PASSWORD '$PASS';
            END IF;
          END \$\$;
          SELECT 'CREATE DATABASE mikcloud OWNER mikcloud'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='mikcloud')\gexec
          SQL
            sudo tee /etc/mikcloud/localpg.env > /dev/null <<ENVEOF
          # PostgreSQL local Ftechci (N°274) — root:root 600. NE JAMAIS LOGGUER.
          LOCALPG_DSN=postgresql://mikcloud:$PASS@127.0.0.1:5432/mikcloud?sslmode=disable
          ENVEOF
            sudo chmod 600 /etc/mikcloud/localpg.env
            echo "localpg.env créé"
          else
            echo "localpg.env déjà présent (DSN inchangé)"
          fi
          sudo -u postgres psql -d mikcloud -tc "SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements'" | grep -q 1 \
            || sudo -u postgres psql -d mikcloud -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
          echo "═══ 6. Vérifications ═══"
          sudo -u postgres psql -Atc "SHOW shared_buffers; SHOW archive_mode; SHOW archive_command;" 
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          psql "$LOCALPG_DSN" -Atc "SELECT 'CONNEXION OK — ' || version()" | head -1
          echo "═══ SETUP-PG TERMINÉ ═══"
          REMOTE

      - name: mode=restore — restore dump → PG local + vérification intégrité
        if: ${{ env.RESOLVED_MODE == 'restore' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s -- "$DUMP_FILE" <<'REMOTE'
          set -euo pipefail
          DUMP_FILE="${1:-}"
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          DUMP="/var/backups/mikcloud/db/${DUMP_FILE:-}"
          if [ -z "$DUMP_FILE" ]; then
          # N°275 : l'artefact DR est un dump du primaire (primary-*) ;
          # les anciens supabase-*.dump restent admis (période N°274)
            DUMP=$(ls -1t /var/backups/mikcloud/db/primary-*.dump /var/backups/mikcloud/db/supabase-*.dump 2>/dev/null | head -1 || true)
          fi
          [ -n "$DUMP" ] && [ -s "$DUMP" ] || { echo "AUCUN DUMP dans /var/backups/mikcloud/db — lancer mode=backup d'abord"; exit 1; }
          echo "═══ 1. Restore : $DUMP ═══"
          T1=$(date +%s)
          # base FRAÎCHE à chaque restore (le dump embarque CREATE SCHEMA public
          # qui échouerait sur un schéma préexistant) ; WITH (FORCE) purge les
          # connexions résiduelles d'un re-run
          sudo -u postgres psql -c 'DROP DATABASE IF EXISTS mikcloud WITH (FORCE);' >/dev/null
          sudo -u postgres psql -c "CREATE DATABASE mikcloud OWNER mikcloud;"
          # le dump embarque CREATE SCHEMA public (sans IF NOT EXISTS) qui
          # heurte le schéma public natif du template PG 15+ → exclusion TOC
          pg_restore -l "$DUMP" | grep -v ' SCHEMA ' > /tmp/toc.list
          pg_restore --exit-on-error --use-list=/tmp/toc.list --no-owner --no-privileges --role=mikcloud --jobs=4 -d "$LOCALPG_DSN" "$DUMP" 2> /tmp/restore.err \
            || { echo "❌ pg_restore ÉCHOUÉ :"; tail -20 /tmp/restore.err; exit 1; }
          echo "restore terminé en $(( $(date +%s) - T1 )) s"
          echo "═══ 2. Extension + autovacuum chirurgical (tables chaudes) ═══"
          sudo -u postgres psql -d mikcloud -tc "SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements'" | grep -q 1 \
            || sudo -u postgres psql -d mikcloud -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
          psql "$LOCALPG_DSN" <<SQL
          DO \$\$ DECLARE t text;
          BEGIN
            FOREACH t IN ARRAY ARRAY['health_checkpoint','hotspot_users','routers','settings','commands']
            LOOP
              IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name=t) THEN
                EXECUTE format('ALTER TABLE public.%I SET (autovacuum_vacuum_scale_factor=0.02, autovacuum_analyze_scale_factor=0.01, autovacuum_vacuum_cost_delay=1)', t);
                RAISE NOTICE 'autovacuum chirurgical: %', t;
              END IF;
            END LOOP;
          END \$\$;
          SQL
          echo "═══ 3. ANALYZE ═══"
          vacuumdb --dbname "$LOCALPG_DSN" --analyze --quiet
          echo "═══ 4. Comparaison comptages local vs dernière mesure Supabase ═══"
          Q=$(psql "$LOCALPG_DSN" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          psql "$LOCALPG_DSN" -At -c "$Q" | sort > /tmp/counts_local.txt
          NT=$(wc -l < /tmp/counts_local.txt)
          echo "tables local: $NT — lignes: $(awk -F'|' '{s+=$2} END {print s}' /tmp/counts_local.txt)"
          [ "$NT" -ge 30 ] || { echo "❌ $NT tables seulement — restore incomplet"; exit 1; }
          [ "$(awk -F'|' '{s+=$2} END {print s}' /tmp/counts_local.txt)" -gt 0 ] || { echo "❌ base locale vide — restore incomplet"; exit 1; }
          REF=/var/backups/counts-supabase-last.txt
          if sudo test -f "$REF"; then
            sudo cat "$REF" | sort > /tmp/counts_ref.txt
            # Supabase VIT en continu (insertions + purges) : hors fenêtre gelée
            # du cutover, tout écart vs une référence antérieure est ATTENDU →
            # verdict informatif (le contrôle strict vit dans le cutover).
            if diff -u /tmp/counts_ref.txt /tmp/counts_local.txt; then
              echo "✅ comptages identiques à la référence (aucune écriture Supabase depuis)"
            else
              echo "⚠ écarts vs référence antérieure = écritures Supabase vivante (attendu — le dump EST la vérité restaurée)"
            fi
          else
            echo "⚠ référence Supabase absente — comptages affichés sans comparaison"; cat /tmp/counts_local.txt
          fi
          echo "═══ 5. Taille + références ═══"
          psql "$LOCALPG_DSN" -Atc "SELECT pg_size_pretty(pg_database_size('mikcloud')) AS taille"
          echo "═══ RESTORE TERMINÉ ═══"
          REMOTE

      - name: mode=cutover — bascule primaire → PG local (delta + preuves + rollback auto)
        if: ${{ env.RESOLVED_MODE == 'cutover' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "MIK-DB-HYBRID" ]; then
            echo "❌ Confirmation absente — relancer avec confirm=MIK-DB-HYBRID"; exit 1
          fi
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          T0=$(date -u +%FT%TZ)
          echo "═══ CUTOVER démarré à $T0 ═══"
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          set -a; . <(sudo cat /etc/mikcloud/backup.env); set +a
          echo "═══ GARDE 1 : backend sain avant geste ═══"
          curl -fsS -o /dev/null http://127.0.0.1:4000/ || { echo "backend KO avant cutover — abort"; exit 1; }
          pg_isready -h 127.0.0.1 -p 5432 || { echo "PG local pas prêt — abort"; exit 1; }
          echo "═══ GARDE 2 : dump/restore DELTA (backend continue sur Supabase) ═══"
          sudo install -d -o "$USER" -m 755 /var/backups/mikcloud/db
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          DUMP=/var/backups/mikcloud/db/supabase-$STAMP.dump
          pg_dump --schema=public --no-owner --no-privileges -Fc -f "$DUMP" "$DATABASE_URL_SESSION"
          [ -s "$DUMP" ] || { echo "DUMP DELTA VIDE — abort"; exit 1; }
          TABLES=$(pg_restore --list "$DUMP" | grep -c ' TABLE ' || true)
          [ "$TABLES" -ge 30 ] || { echo "TOC suspecte — abort"; exit 1; }
          sudo chmod 644 "$DUMP"
          echo "delta dump: $TABLES tables, $(du -h "$DUMP" | cut -f1)"
          sudo -u postgres psql -c 'DROP DATABASE IF EXISTS mikcloud WITH (FORCE);' >/dev/null
          sudo -u postgres psql -c "CREATE DATABASE mikcloud OWNER mikcloud;" >/dev/null
          pg_restore -l "$DUMP" | grep -v ' SCHEMA ' > /tmp/toc.list
          pg_restore --exit-on-error --use-list=/tmp/toc.list --no-owner --no-privileges --role=mikcloud --jobs=4 -d "$LOCALPG_DSN" "$DUMP" 2> /tmp/restore.err \
            || { echo "❌ pg_restore delta ÉCHOUÉ :"; tail -20 /tmp/restore.err; exit 1; }
          # l'extension pg_stat_statements n'est PAS restaurée par pg_restore
          # (CREATE EXTENSION réservé au superuser) → recréée par postgres
          sudo -u postgres psql -d mikcloud -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements" >/dev/null \
            || echo "⚠ pg_stat_statements non recréé (télémétrie indisponible, non bloquant)"
          vacuumdb --dbname "$LOCALPG_DSN" --analyze --quiet
          # Entre le dump delta et ce diff, le backend ENCORE sur Supabase continue
          # d'écrire : les upserts ne changent PAS les counts (health_checkpoint,
          # hotspot_users, settings, routers) ; seules les INSERT-only dérivent
          # (web_vitals…) → tolérance directionnelle whitelistée, tout le reste = abort.
          Q=$(psql "$DATABASE_URL_SESSION" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          psql "$DATABASE_URL_SESSION" -At -c "$Q" | sort > /tmp/counts_src.txt
          QL=$(psql "$LOCALPG_DSN" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          psql "$LOCALPG_DSN" -At -c "$QL" | sort > /tmp/counts_loc.txt
          HARD=0
          while IFS= read -r row; do
            tbl=$(echo "$row" | awk '{print $1}')
            echo "  écart append-only toléré: $row"
            case "$tbl" in
              *vitals*|*command*|*session*|*log*|*event*) : ;;
              *) HARD=1 ;;
            esac
          done < <(diff /tmp/counts_src.txt /tmp/counts_loc.txt | grep '^<' || true)
          while IFS= read -r row; do
            echo "  ❌ table locale SUR-ABONDANTE (impossible si dump frais): $row"
            HARD=1
          done < <(diff /tmp/counts_src.txt /tmp/counts_loc.txt | grep '^>' || true)
          [ "$HARD" = 0 ] || { echo "❌ ÉCART comptages NON TOLÉRÉ au cutover — abort (Supabase inchangé, backend intact)"; exit 1; }
          sudo cp /tmp/counts_src.txt /var/backups/counts-supabase-last.txt
          echo "✅ comptages cohérents: $(wc -l < /tmp/counts_loc.txt) tables, $(awk '{s+=$2} END {print s}' /tmp/counts_loc.txt) lignes"
          echo "═══ GARDE 4 : sauvegarde env + flip DSN ═══"
          BK=/etc/mikcloud/mikcloud.env.pre-hybrid-$(date -u +%Y%m%dT%H%M%SZ)
          sudo cp /etc/mikcloud/mikcloud.env "$BK"; sudo chmod 600 "$BK"
          echo "env sauvegardé: $BK"
          LOCAL_DSN=$(sudo grep '^LOCALPG_DSN=' /etc/mikcloud/localpg.env | cut -d= -f2- | tr -d '\r\n')
          [ -n "$LOCAL_DSN" ] || { echo "LOCALPG_DSN introuvable — abort"; exit 1; }
          ESC_DSN=${LOCAL_DSN//&/\\&}
          sudo sed -i "s|^DATABASE_URL=.*|DATABASE_URL=$ESC_DSN|" /etc/mikcloud/mikcloud.env
          sudo grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | sed -E 's|//[^@/]*@|//***@|'
          echo "═══ 5. Restart backend (SIGTERM → flush final → Load local) ═══"
          sudo systemctl restart mikcloud
          sleep 8
          echo "═══ PREUVE 1 : persistance PostgreSQL ACTIVE (pas de mode dégradé) ═══"
          sudo journalctl -u mikcloud --since "$T0" --no-pager | grep -E 'persistance PostgreSQL active|degraded|dégradé|PostgreSQL injoignable' | head -5 || true
          sudo journalctl -u mikcloud --since "$T0" --no-pager | grep -q 'persistance PostgreSQL active' \
            || { echo "❌ mode PostgreSQL NON confirmé dans les logs — ROLLBACK"; sudo cp "$BK" /etc/mikcloud/mikcloud.env; sudo systemctl restart mikcloud; sleep 8; curl -fsS -o /dev/null http://127.0.0.1:4000/ && echo "ROLLBACK OK — backend sur Supabase"; exit 1; }
          echo "═══ PREUVE 2 : healthcheck backend ═══"
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null http://127.0.0.1:4000/; then echo "backend OK (${i}×5s)"; break; fi
            [ "$i" = 12 ] && { echo "❌ backend injoignable — ROLLBACK"; sudo cp "$BK" /etc/mikcloud/mikcloud.env; sudo systemctl restart mikcloud; exit 1; }
            sleep 5
          done
          echo "═══ PREUVE 3 : écritures réelles sur le local (90 s d'observation) ═══"
          sleep 90
          UPD=$(psql "$LOCALPG_DSN" -Atc "SELECT tup_updated + tup_inserted FROM pg_stat_database WHERE datname='mikcloud'")
          echo "tuples écrits depuis le flip: $UPD"
          [ "${UPD:-0}" -gt 0 ] || { echo "❌ AUCUNE écriture en 90 s — ROLLBACK"; sudo cp "$BK" /etc/mikcloud/mikcloud.env; sudo systemctl restart mikcloud; sleep 8; curl -fsS -o /dev/null http://127.0.0.1:4000/ && echo "ROLLBACK OK"; exit 1; }
          psql "$LOCALPG_DSN" -Atc "SELECT query, calls FROM pg_stat_statements WHERE query ILIKE '%insert%' OR query ILIKE '%update%' ORDER BY calls DESC LIMIT 3" 2>/dev/null \
            || echo "télémétrie pg_stat_statements indisponible (non bloquant)"
          echo "═══ 6. Gel du timer Supabase→Neon (Supabase figé) ═══"
          sudo systemctl disable --now mikcloud-backup.timer 2>/dev/null && echo "timer mikcloud-backup STOPPÉ (réactivé au rollback)" || echo "timer déjà arrêté/absent"
          echo "═══ 7. État final ═══"
          df -h / | sed -n '2p'
          free -h | sed -n '2p'
          echo "═══ CUTOVER RÉUSSI — primaire = PostgreSQL local Ftechci ($T0 → $(date -u +%FT%TZ)) ═══"
          REMOTE

      - name: mode=rollback — retour explicite vers Supabase
        if: ${{ env.RESOLVED_MODE == 'rollback' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "MIK-DB-HYBRID" ]; then
            echo "❌ Confirmation absente — relancer avec confirm=MIK-DB-HYBRID"; exit 1
          fi
          if [ "$ACCEPT_STALE" != "YES" ]; then
            echo "❌ Supabase est FIGÉ depuis le cutover (données périmées)."
            echo "   Relancer avec accept_stale_data=YES pour confirmer le retour."
            exit 1
          fi
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          echo "═══ 1. Dump local de sécurité avant retour ═══"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          sudo install -d -o "$USER" -m 755 /var/backups/mikcloud/db
          pg_dump --schema=public --no-owner --no-privileges -Fc -f /var/backups/mikcloud/db/local-$STAMP.dump "$LOCALPG_DSN" && [ -s /var/backups/mikcloud/db/local-$STAMP.dump ] || { echo "dump sécurité échoué — abort"; exit 1; }
          sudo chmod 644 /var/backups/mikcloud/db/local-$STAMP.dump
          echo "dump local: $(du -h /var/backups/mikcloud/db/local-$STAMP.dump | cut -f1)"
          echo "═══ 2. Restaure le dernier env pre-hybrid ═══"
          BK=$(sudo ls -1t /etc/mikcloud/mikcloud.env.pre-hybrid-* 2>/dev/null | head -1)
          [ -n "$BK" ] || { echo "AUCUN env pre-hybrid — abort"; exit 1; }
          echo "restaure: $BK"
          sudo cp "$BK" /etc/mikcloud/mikcloud.env
          sudo grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | sed -E 's|//[^@/]*@|//***@|'
          echo "═══ 3. Restart + healthcheck ═══"
          sudo systemctl restart mikcloud
          sleep 8
          for i in $(seq 1 12); do
            curl -fsS -o /dev/null http://127.0.0.1:4000/ && { echo "backend OK"; break; }
            [ "$i" = 12 ] && { echo "❌ backend KO après rollback"; exit 1; }
            sleep 5
          done
          echo "═══ 4. Réactive le timer Supabase→Neon ═══"
          sudo systemctl enable --now mikcloud-backup.timer && echo "timer réactivé" || echo "timer: état inchangé"
          sudo journalctl -u mikcloud --since "-2 min" --no-pager | grep -E 'persistance PostgreSQL active|dégradé' | head -3 || true
          echo "═══ ROLLBACK TERMINÉ — primaire = Supabase ═══"
          REMOTE

      - name: mode=status — état hybride complet
        if: ${{ env.RESOLVED_MODE == 'status' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          sudo test -f /etc/mikcloud/mikcloud.env || { echo "mikcloud.env absent"; exit 1; }
          echo "═══ Backend ═══"
          systemctl is-active mikcloud && echo "mikcloud: ACTIF" || echo "mikcloud: INACTIF"
          curl -fsS -o /dev/null -w "backend HTTP %{http_code} (%{time_total}s)\n" http://127.0.0.1:4000/ || echo "backend: KO"
          echo "DSN actif (sans creds): $(sudo grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | sed -E 's|//[^@/]*@|//***@|; s|^DATABASE_URL=||')"
          echo "env pre-hybrid dispo: $(sudo ls -1 /etc/mikcloud/mikcloud.env.pre-hybrid-* 2>/dev/null | wc -l)"
          # PROTECTION post-cutover (N°274-septies, idempotent) : si le primaire
          # est le PG local, le timer Supabase→Neon DOIT rester gelé — sinon il
          # recopierait Supabase figé vers Neon (écrasement du coffre).
          if sudo grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | grep -q '127.0.0.1:5432/mikcloud'; then
            echo "PRIMAIRE = PostgreSQL local"
            sudo systemctl disable --now mikcloud-backup.timer 2>/dev/null && echo "PROTECTION: timer mikcloud-backup GELÉ" || echo "PROTECTION: timer déjà gelé/absent"
          else
            echo "PRIMAIRE = Supabase (pre/post cutover)"
          fi
          echo "═══ PostgreSQL local ═══"
          pg_isready -h 127.0.0.1 -p 5432 || true
          if sudo test -f /etc/mikcloud/localpg.env; then
            set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
            psql "$LOCALPG_DSN" -Atc "SELECT 'taille DB: ' || pg_size_pretty(pg_database_size('mikcloud'))" || true
            psql "$LOCALPG_DSN" -Atc "SELECT 'tuples écrits: ' || (tup_inserted + tup_updated) FROM pg_stat_database WHERE datname='mikcloud'" || true
            echo "--- comptages local (aperçu top 10) ---"
            Q=$(psql "$LOCALPG_DSN" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
            psql "$LOCALPG_DSN" -At -c "$Q" | sort -k2 -rn | head -10
            echo "WAL archivés: $(sudo ls /var/backups/mikcloud/wal 2>/dev/null | wc -l) fichiers"
            echo "Dernier dump: $(ls -1t /var/backups/mikcloud/db/ 2>/dev/null | head -3 | tr '\n' ' ')"
          else
            echo "localpg.env ABSENT — setup-pg non fait"
          fi
          echo "═══ Drift local vs Supabase ═══"
          if sudo test -f /etc/mikcloud/localpg.env && sudo test -f /etc/mikcloud/backup.env; then
            set -a; . <(sudo cat /etc/mikcloud/localpg.env); . <(sudo cat /etc/mikcloud/backup.env); set +a
            if psql "$LOCALPG_DSN" -Atc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' LIMIT 1" | grep -q 1; then
              Q=$(psql "$LOCALPG_DSN" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
              psql "$LOCALPG_DSN" -At -c "$Q" | sort > /tmp/c_local.txt
              if psql "$DATABASE_URL_SESSION" -Atc "SELECT 1" 2>/dev/null | grep -q 1; then
                QS=$(psql "$DATABASE_URL_SESSION" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) AS n FROM public.%I', table_name, table_name), ' UNION ALL ' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
                psql "$DATABASE_URL_SESSION" -At -c "$QS" | sort > /tmp/c_supa.txt
                LINES_DIFF=$(diff /tmp/c_local.txt /tmp/c_supa.txt | grep -cE '^[<>]' || true)
                echo "tables en écart local/Supabase: $LINES_DIFF"
                diff /tmp/c_local.txt /tmp/c_supa.txt | head -10 || true
              else
                echo "Supabase injoignable"
              fi
            else
              echo "PG local vide (pas encore restauré)"
            fi
          fi
          echo "═══ Timer backup ═══"
          systemctl is-enabled mikcloud-backup.timer 2>/dev/null || echo "timer mikcloud-backup: DÉSACTIVÉ (normal post-cutover)"
          echo "═══ Ressources ═══"
          df -h / | sed -n '2p'; free -h | sed -n '2p'; uptime
          REMOTE

      - name: mode=arm-dr — chaîne DR N°275 (confirm MIK-DR-ARM)
        if: ${{ env.RESOLVED_MODE == 'arm-dr' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          if [ "$CONFIRM" != "MIK-DR-ARM" ]; then
            echo "❌ REFUS — mode arm-dr exige confirm=MIK-DR-ARM (pose credentials OCI sur la VM + bucket + timers)"; exit 1
          fi
          for v in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_REGION OCI_KEY; do
            [ -n "${!v}" ] || { echo "❌ secret $v absent du coffre GitHub"; exit 1; }
          done
          # clé API OCI → VM par stdin (jamais en ligne de commande ni dans le log)
          printf '%s\n' "$OCI_KEY" | ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" 'cat > /tmp/oci_api_key.pem && chmod 600 /tmp/oci_api_key.pem'
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s -- "$CONFIRM" "$OCI_USER" "$OCI_TENANCY" "$OCI_FINGERPRINT" "$OCI_REGION" <<'REMOTE'
          set -euo pipefail
          CONFIRM="${1:-}"; OCI_USER="${2:-}"; OCI_TENANCY="${3:-}"; OCI_FP="${4:-}"; OCI_REGION="${5:-}"
          [ "$CONFIRM" = "MIK-DR-ARM" ] || { echo "❌ confirm invalide côté VM"; exit 1; }
          PGCONF=/etc/postgresql/18/main/conf.d/mikcloud.conf
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq >/dev/null 2>&1 || true
          echo "═══ 0. Preflight (lecture seule) ═══"
          sudo test -f "$PGCONF" || { echo "❌ conf PG introuvable"; exit 1; }
          echo "archive_command actuel: $(sudo grep -E '^archive_command' "$PGCONF")"
          echo "archive_timeout:        $(sudo grep -E '^archive_timeout' "$PGCONF")"
          echo "WAL locaux: $(sudo bash -c 'ls /var/backups/mikcloud/wal 2>/dev/null | wc -l') fichiers, $(sudo du -sh /var/backups/mikcloud/wal 2>/dev/null | cut -f1)"
          command -v oci >/dev/null 2>&1 && echo "oci CLI: déjà présent" || echo "oci CLI: absent → installation"
          pg_dump --version
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          : "${LOCALPG_DSN:?localpg.env incomplet}"
          set -a; . <(sudo cat /etc/mikcloud/backup.env); set +a
          : "${DATABASE_URL_SESSION:?backup.env incomplet}"
          : "${NEON_DATABASE_URL:?backup.env incomplet}"
          echo "chats Telegram d'alerte candidats (notif_settings, plus ancien d'abord):"
          psql "$LOCALPG_DSN" -Atc "SELECT a.created_at || ' | ' || n.account_id || ' | ' || CASE WHEN n.telegram_chat_id='' THEN '(vide)' ELSE 'posé' END FROM notif_settings n LEFT JOIN accounts a ON a.id=n.account_id ORDER BY a.created_at NULLS LAST" || true
          echo "═══ 1. archive_command → gzip (le WAL brut creusait ~17 Go/j) ═══"
          if sudo grep -E '^archive_command' "$PGCONF" | grep -q gzip; then
            echo "déjà compressé — inchangé"
          else
            sudo sed -i "s|^archive_command.*|archive_command = 'gzip -c %p > /var/backups/mikcloud/wal/%f.gz.tmp \&\& mv /var/backups/mikcloud/wal/%f.gz.tmp /var/backups/mikcloud/wal/%f.gz'|" "$PGCONF"
            echo "nouveau: $(sudo grep -E '^archive_command' "$PGCONF")"
            sudo -u postgres psql -Atc 'SELECT pg_reload_conf()' >/dev/null
            echo "reload envoyé — attente d'un segment .gz (≤130 s)…"
            OKGZ=""
            for i in $(seq 1 26); do
              sleep 5
              if sudo bash -c 'ls /var/backups/mikcloud/wal/*.gz >/dev/null 2>&1'; then OKGZ=yes; break; fi
            done
            if [ -n "$OKGZ" ]; then echo "✅ archivage .gz confirmé"
            else echo "⚠ aucun .gz après 130 s — vérifier journalctl -u postgresql@18-main (l'uploader accepte les deux formats)"; fi
          fi
          echo "═══ 2. OCI CLI + credentials Object Storage + bucket ═══"
          if ! command -v oci >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq python3-oci-cli >/dev/null 2>&1 \
              || python3 -m pip install --quiet --break-system-packages oci-cli \
              || { echo "❌ installation oci-cli impossible"; exit 1; }
          fi
          sudo install -d -o root -g root -m 700 /etc/oci
          sudo mv /tmp/oci_api_key.pem /etc/oci/oci_api_key.pem
          sudo chmod 600 /etc/oci/oci_api_key.pem
          sudo tee /etc/oci/config > /dev/null <<OCICONF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FP
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/etc/oci/oci_api_key.pem
          OCICONF
          sudo chmod 600 /etc/oci/config
          FP_CALC="$(sudo openssl pkey -in /etc/oci/oci_api_key.pem -pubout -outform DER 2>/dev/null | openssl md5 | awk '{print $NF}' | tr -d ':')"
          FP_REF="$(echo "$OCI_FP" | tr -d ':')"
          if [ -z "$FP_CALC" ] || [ "$FP_CALC" != "$FP_REF" ]; then echo "❌ empreinte clé OCI ≠ fingerprint ($FP_CALC vs $FP_REF)"; exit 1; fi
          echo "cohérence clé/empreinte OK"
          NS_JSON=$(oci --config-file /etc/oci/config os ns get 2>&1)
          NS=$(echo "$NS_JSON" | jq -r '.data // .' 2>/dev/null | tr -d '"[:space:]')
          [ -n "$NS" ] || { echo "❌ namespace OCI illisible: $NS_JSON"; exit 1; }
          echo "namespace: $NS"
          if oci --config-file /etc/oci/config os bucket get --namespace "$NS" --name mikcloud-wal >/dev/null 2>&1; then
            echo "bucket mikcloud-wal: existe déjà"
          else
            oci --config-file /etc/oci/config os bucket create --namespace "$NS" --name mikcloud-wal >/dev/null \
              && echo "bucket mikcloud-wal: CRÉÉ" || { echo "❌ création bucket échouée"; exit 1; }
          fi
          cat > /tmp/olc.json <<OLC
          {"items":[{"name":"expire-21d","action":"DELETE","timeAmount":21,"timeUnit":"DAYS","isEnabled":true}]}
          OLC
          if oci --config-file /etc/oci/config os object-lifecycle-policy put --namespace "$NS" --bucket-name mikcloud-wal --from-json file:///tmp/olc.json >/dev/null 2>&1; then
            echo "lifecycle 21 jours: posé (budget gratuit 10 Go respecté)"
          else
            echo "⚠ lifecycle non posé (non bloquant)"
          fi
          rm -f /tmp/olc.json
          echo "═══ 3. Scripts DR ═══"
          sudo tee /etc/mikcloud/walupload.env > /dev/null <<WALEOF
          WAL_BUCKET=mikcloud-wal
          WAL_NS=$NS
          WALEOF
          sudo chmod 600 /etc/mikcloud/walupload.env
          sudo tee /usr/local/sbin/mikcloud-wal-upload > /dev/null <<'WALUP_EOF'
          #!/usr/bin/env bash
          # N°275 — Tier1.5 : upload des WAL archivés vers OCI Object Storage.
          # Timer mikcloud-wal-upload.timer (*/5 min). Idempotent : la liste
          # /var/lib/mikcloud/wal-uploaded.list retient les segments déjà partis.
          # Le bucket ne contient QUE des objets '<segment>.gz' ; les fichiers
          # bruts de la période N°274 sont gzippés à la volée.
          # Prune locale : segments uploadés quittent le disque après 48 h
          # (immédiatement si / dépasse 70 %) — le disque protège le PG primaire.
          set -uo pipefail   # sans -e : un upload raté ne tue pas les suivants
          WAL_DIR=/var/backups/mikcloud/wal
          STATED=/var/lib/mikcloud
          STATE="$STATED/wal-uploaded.list"
          [ -r /etc/mikcloud/walupload.env ] || { echo "wal-upload: env absent — arm-dr pas fait"; exit 0; }
          . /etc/mikcloud/walupload.env
          [ -n "${WAL_BUCKET:-}" ] && [ -n "${WAL_NS:-}" ] || { echo "wal-upload: env incomplet"; exit 1; }
          [ -d "$WAL_DIR" ] || exit 0
          OCI_BIN=$(command -v oci || true)
          [ -n "$OCI_BIN" ] || { echo "wal-upload: oci absent"; exit 1; }
          mkdir -p "$STATED"; touch "$STATE"
          NEW=0; FAIL=0; SKIP=0
          for f in "$WAL_DIR"/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            case "$b" in *.tmp|*.upload) continue ;; esac
            seg="${b%.gz}"
            if grep -qx "$seg" "$STATE"; then SKIP=$((SKIP+1)); continue; fi
            if [[ "$b" == *.gz ]]; then
              upfile="$f"
            else
              upfile="/tmp/${seg}.gz.up"
              gzip -c "$f" > "$upfile" || { rm -f "$upfile"; FAIL=$((FAIL+1)); continue; }
            fi
            if "$OCI_BIN" os object put --config-file /etc/oci/config --namespace "$WAL_NS" \
                 --bucket-name "$WAL_BUCKET" --name "${seg}.gz" --file "$upfile" --force >/dev/null 2>&1; then
              echo "$seg" >> "$STATE"; NEW=$((NEW+1))
            else
              FAIL=$((FAIL+1)); echo "wal-upload: échec upload $seg"
            fi
            [[ "$b" == *.gz ]] || rm -f "$upfile"
          done
          PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$PCT" -ge 70 ]; then AGE=30; else AGE=2880; fi
          while IFS= read -r p; do
            b=$(basename "$p"); case "$b" in *.tmp|*.upload) continue ;; esac
            grep -qx "${b%.gz}" "$STATE" && rm -f -- "$p"
          done < <(find "$WAL_DIR" -type f -mmin +"$AGE")
          date -u +%FT%TZ > "$STATED/wal-upload.last"
          printf 'last_run=%s\nnew=%s skip=%s fail=%s disk=%s%%\n' "$(date -u +%FT%TZ)" "$NEW" "$SKIP" "$FAIL" "$PCT" > "$STATED/wal-upload.status"
          [ "$FAIL" -eq 0 ] || exit 1
          WALUP_EOF
          sudo chmod 755 /usr/local/sbin/mikcloud-wal-upload
          sudo tee /usr/local/sbin/mikcloud-reverse-sync > /dev/null <<'RSYNC_EOF'
          #!/usr/bin/env bash
          # N°275 — Tier2 : reverse-sync nocturne primaire local → Supabase → Neon.
          # Remplace le flux Supabase→Neon de backup-neon.sh (timer mikcloud-backup
          # GELÉ au cutover N°274) : le primaire est le PG local, les copies suivent.
          # Ordre : rétention web_vitals (local) → pg_basebackup (PITR) → dump
          # primaire (-Fc) → restore Supabase (pooler SESSION, --clean, RLS ré-armé)
          # → restore Neon (endpoint direct). Retry ×3, dump fichier 2 phases
          # (pièges N°243), TOC filtré SCHEMA+EXTENSION (pièges N°274/243-c).
          set -uo pipefail
          set -a; . /etc/mikcloud/localpg.env; set +a
          set -a; . /etc/mikcloud/backup.env; set +a
          [ -r /etc/mikcloud/monitor.env ] && . /etc/mikcloud/monitor.env
          [ -r /etc/mikcloud/walupload.env ] && . /etc/mikcloud/walupload.env
          RET_DAYS="${WEB_VITALS_RETENTION_DAYS:-90}"
          : "${LOCALPG_DSN:?localpg.env incomplet}"
          : "${DATABASE_URL_SESSION:?backup.env incomplet}"
          : "${NEON_DATABASE_URL:?backup.env incomplet}"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p /var/lib/mikcloud /var/backups/mikcloud/db /var/log/mikcloud
          LOGF=/var/log/mikcloud/reverse-sync.log
          STATUS=/var/lib/mikcloud/reverse-sync.status
          # rotation maison (garde 1 génération)
          [ -f "$LOGF" ] && [ "$(stat -c %s "$LOGF")" -gt 5242880 ] && mv -f "$LOGF" "$LOGF.1"
          log(){ echo "reverse-sync[$STAMP]: $*" | tee -a "$LOGF"; }
          fail(){ log "ÉCHEC: $*"; printf 'last_success=\nlast_run=%s\nerror=%s\n' "$STAMP" "$*" > "$STATUS"; exit 1; }
          trap 'rm -f /tmp/mikcloud-rs-*.list' EXIT
          log "départ (rétention web_vitals=${RET_DAYS}j)"
          # 0. rétention web_vitals (append-only — 5,9k lignes/j, purge > N jours)
          psql "$LOCALPG_DSN" -q -c "DELETE FROM web_vitals WHERE sampled_at < now() - interval '${RET_DAYS} days'" || fail "rétention web_vitals"
          psql "$LOCALPG_DSN" -q -c "VACUUM ANALYZE web_vitals" || true
          # 1. base backup quotidien → bucket (PITR = base + WAL)
          if [ -n "${WAL_NS:-}" ] && [ -n "${WAL_BUCKET:-}" ] && [ -f /etc/oci/config ]; then
            BB=/tmp/mikcloud-bb-$STAMP
            rm -rf "$BB"; install -d -o postgres -g postgres -m 700 "$BB"
            if sudo -u postgres pg_basebackup -D "$BB" -Ft -X stream 2>>"$LOGF"; then
              tar -C "$BB" -czf /tmp/mikcloud-base-$STAMP.tar.gz . 2>>"$LOGF"
              if oci --config-file /etc/oci/config os object put --namespace "$WAL_NS" \
                   --bucket-name "$WAL_BUCKET" --name "basebackup/base-$STAMP.tar.gz" \
                   --file "/tmp/mikcloud-base-$STAMP.tar.gz" --force >>"$LOGF" 2>&1; then
                log "base backup uploadé ($(du -h /tmp/mikcloud-base-$STAMP.tar.gz | cut -f1))"
              else
                log "AVERTISSEMENT: base backup NON uploadé — PITR dégradé"
              fi
              rm -rf "$BB" "/tmp/mikcloud-base-$STAMP.tar.gz"
            else
              rm -rf "$BB"; log "AVERTISSEMENT: pg_basebackup en échec — PITR dégradé (flux continu)"
            fi
          else
            log "AVERTISSEMENT: walupload.env/oci absent — base backup sauté"
          fi
          # 2. dump du primaire local (-Fc, schéma public, deux phases fichier)
          DUMP=/var/backups/mikcloud/db/primary-$STAMP.dump
          pg_dump --schema=public --no-owner --no-privileges -Fc -f "$DUMP" "$LOCALPG_DSN" 2>>"$LOGF" || fail "pg_dump local"
          [ -s "$DUMP" ] || fail "dump vide"
          TABS=$(pg_restore --list "$DUMP" | grep -c ' TABLE ' || true)
          [ "$TABS" -ge 30 ] || fail "TOC suspecte ($TABS tables)"
          log "dump OK ($TABS tables, $(du -h "$DUMP" | cut -f1))"
          # 3. TOC filtré : SCHEMA public (piège N°274-quinquies) + EXTENSION
          #    (supabase_vault N°243-c ; DROP/CREATE EXTENSION interdits côté cibles)
          pg_restore --list "$DUMP" | grep -vE ' (SCHEMA|EXTENSION) ' > "/tmp/mikcloud-rs-$STAMP.list"
          # 4. restore Supabase (pooler SESSION :5432, JAMAIS :6543)
          for a in 1 2 3; do
            if pg_restore --clean --if-exists --no-owner --no-privileges \
                 --use-list="/tmp/mikcloud-rs-$STAMP.list" -d "$DATABASE_URL_SESSION" 2>>"$LOGF"; then break; fi
            [ "$a" = 3 ] && fail "restore Supabase (3 tentatives)"
            log "restore Supabase tentative $a échouée — relance dans 30 s"; sleep 30
          done
          # RLS ré-armé : le restore recrée les tables avec le RLS du dump local,
          # on le ré-affirme explicitement (défense PostgREST sans policy = deny-all)
          psql "$DATABASE_URL_SESSION" -Atc "SELECT format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY', tablename) FROM pg_tables WHERE schemaname='public'" | psql "$DATABASE_URL_SESSION" -q || log "AVERTISSEMENT: RLS Supabase"
          SUPA_T=$(psql "$DATABASE_URL_SESSION" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          [ "$SUPA_T" -ge 30 ] || fail "Supabase: $SUPA_T tables après restore"
          log "Supabase re-synchronisé ($SUPA_T tables)"
          # 5. restore Neon (endpoint DIRECT, non poolé)
          for a in 1 2 3; do
            if pg_restore --clean --if-exists --no-owner --no-privileges \
                 --use-list="/tmp/mikcloud-rs-$STAMP.list" -d "$NEON_DATABASE_URL" 2>>"$LOGF"; then break; fi
            [ "$a" = 3 ] && fail "restore Neon (3 tentatives)"
            log "restore Neon tentative $a échouée — relance dans 30 s"; sleep 30
          done
          NEON_T=$(psql "$NEON_DATABASE_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          [ "$NEON_T" -ge 30 ] || fail "Neon: $NEON_T tables après restore"
          log "Neon re-synchronisé ($NEON_T tables)"
          # 6. ménage (garde 3 dumps), statut, rafraîchissement chat d'alerte
          ls -1t /var/backups/mikcloud/db/primary-*.dump 2>/dev/null | tail -n +4 | xargs -r rm -f
          rm -f "/tmp/mikcloud-rs-$STAMP.list"
          CHATS=$(psql "$LOCALPG_DSN" -Atc "SELECT n.telegram_chat_id FROM notif_settings n LEFT JOIN accounts a ON a.id=n.account_id WHERE n.telegram_enabled=TRUE AND n.telegram_chat_id<>'' ORDER BY a.created_at NULLS LAST LIMIT 1")
          if [ -n "$CHATS" ]; then
            printf 'OPS_TELEGRAM_CHATS=%s\nWEB_VITALS_RETENTION_DAYS=%s\n' "$CHATS" "$RET_DAYS" > /etc/mikcloud/monitor.env.tmp
            mv /etc/mikcloud/monitor.env.tmp /etc/mikcloud/monitor.env; chmod 600 /etc/mikcloud/monitor.env
          fi
          printf 'last_success=%s\nlast_run=%s\nsupa_tables=%s\nneon_tables=%s\ndump=%s\n' "$(date -u +%FT%TZ)" "$STAMP" "$SUPA_T" "$NEON_T" "$DUMP" > "$STATUS"
          log "succès — Supabase=$SUPA_T tables · Neon=$NEON_T tables · dump=$(du -h "$DUMP" | cut -f1)"
          RSYNC_EOF
          sudo chmod 755 /usr/local/sbin/mikcloud-reverse-sync
          sudo tee /usr/local/sbin/mikcloud-monitor > /dev/null <<'MON_EOF'
          #!/usr/bin/env bash
          # N°275 — Monitoring Telegram de la chaîne hybride (timer */15 min).
          # Anti-spam : alerte au déclenchement d'incident puis au max toutes
          # les 4 h ; message de rétablissement ; heartbeat quotidien 06:00 UTC.
          # Bot = TELEGRAM_PLATFORM_BOT_TOKEN de /etc/mikcloud/mikcloud.env ;
          # chat = OPS_TELEGRAM_CHATS de /etc/mikcloud/monitor.env.
          set -uo pipefail
          STATED=/var/lib/mikcloud
          STATE="$STATED/monitor.state"; STATUSF="$STATED/monitor.status"
          [ -r /etc/mikcloud/monitor.env ] && . /etc/mikcloud/monitor.env
          [ -r /etc/mikcloud/localpg.env ] && . /etc/mikcloud/localpg.env
          set -a; . /etc/mikcloud/mikcloud.env; set +a
          TOKEN="${TELEGRAM_PLATFORM_BOT_TOKEN:-}"
          CHATS="${OPS_TELEGRAM_CHATS:-}"
          NOW=$(date +%s); HOUR=$(date -u +%H)
          FAILS=""; OKS=""
          addf(){ FAILS="$FAILS$1\n"; }
          addo(){ OKS="$OKS$1\n"; }
          # 1. PG local
          if pg_isready -q -h 127.0.0.1 -p 5432; then addo "PG local: up"; else addf "PG local: DOWN"; fi
          # 2. backend
          if systemctl is-active -q mikcloud && [ "$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:4000/ 2>/dev/null)" = "200" ]; then addo "backend: 200"; else addf "backend: KO"; fi
          # 3. DSN = local (anti-retour-silencieux N°274)
          if grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | head -1 | grep -q '127.0.0.1:5432/mikcloud'; then addo "DSN: primaire local"; else addf "DSN: PAS le local (retour Supabase ?)"; fi
          # 4. persistance vivante (tup_written doit croître — flush ≤3 s)
          TW=$(psql "${LOCALPG_DSN:-}" -Atc "SELECT tup_inserted+tup_updated FROM pg_stat_database WHERE datname='mikcloud'" 2>/dev/null || echo 0)
          if [ -f "$STATED/tup.prev" ]; then
            PREV=$(cat "$STATED/tup.prev"); echo "$TW" > "$STATED/tup.prev"
            if [ "$TW" -gt "$PREV" ] 2>/dev/null; then addo "flush PG: actif (+$((TW-PREV)) tuples/15min)"; else addf "flush PG: GELÉ (tup_written stable) — mode dégradé ?"; fi
          else
            echo "$TW" > "$STATED/tup.prev"; addo "flush PG: première mesure ($TW)"
          fi
          # 5. WAL local frais (archive_timeout 60 s → généreux : 15 min)
          NEWEST=$(find /var/backups/mikcloud/wal -type f ! -name '*.tmp' -printf '%T@\n' 2>/dev/null | sort -rn | head -1)
          if [ -n "$NEWEST" ]; then
            AGE=$(( NOW - ${NEWEST%.*} ))
            if [ "$AGE" -le 900 ]; then addo "WAL local: dernier segment il y a $((AGE/60)) min"; else addf "WAL local: dernier segment il y a $((AGE/60)) min (>15) — archivage bloqué ?"; fi
          else addf "WAL local: répertoire vide"; fi
          # 6. WAL distant (Tier1.5)
          if [ -f "$STATED/wal-upload.last" ]; then
            UP_AGE=$(( NOW - $(stat -c %Y "$STATED/wal-upload.last") ))
            if [ "$UP_AGE" -le 1200 ]; then addo "WAL→Object Storage: il y a $((UP_AGE/60)) min"; else addf "WAL→Object Storage: il y a $((UP_AGE/60)) min (>20)"; fi
          else addf "WAL→Object Storage: jamais exécuté"; fi
          # 7. reverse-sync frais (≤ 26 h)
          if [ -f "$STATED/reverse-sync.status" ]; then
            LS=$(sed -n 's/^last_success=//p' "$STATED/reverse-sync.status")
            if [ -n "$LS" ]; then
              RS_AGE=$(( (NOW - $(date -d "$LS" +%s 2>/dev/null || echo 0)) / 3600 ))
              if [ "$RS_AGE" -le 26 ]; then addo "reverse-sync: il y a ${RS_AGE}h"; else addf "reverse-sync: il y a ${RS_AGE}h (>26)"; fi
            else addf "reverse-sync: dernier run en ÉCHEC"; fi
          else addf "reverse-sync: jamais exécuté"; fi
          # 8. ressources
          PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$PCT" -lt 85 ]; then addo "disque: ${PCT}%"; else addf "disque: ${PCT}%"; fi
          RAM=$(free -m | awk '/^Mem:/{print $7}')
          if [ "$RAM" -gt 1500 ] 2>/dev/null; then addo "RAM dispo: ${RAM}M"; else addf "RAM dispo: ${RAM}M"; fi
          LOAD=$(awk '{print int($1)}' /proc/loadavg)
          if [ "$LOAD" -lt 4 ]; then addo "load: $LOAD"; else addf "load: $LOAD (>4 sur 4 OCPU)"; fi
          # 9. unités en échec
          for u in mikcloud-wal-upload mikcloud-reverse-sync; do
            R=$(systemctl show -p Result --value "$u.service" 2>/dev/null)
            [ "$R" = "success" ] || addf "$u.service: Result=$R"
          done
          send(){
            [ -n "$TOKEN" ] && [ -n "$CHATS" ] || return 0
            for c in $CHATS; do
              curl -fsS -m 10 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -d chat_id="$c" --data-urlencode "text=$1" >/dev/null 2>&1 || true
            done
          }
          INC=$(cat "$STATE" 2>/dev/null || echo "")
          if [ -n "$FAILS" ]; then
            LAST_ALERT=$(cat "$STATED/last_alert" 2>/dev/null || echo 0)
            if [ "$INC" != "incident" ] || [ $(( NOW - LAST_ALERT )) -ge 14400 ]; then
              send "🔴 mikcloud DR — ANOMALIES
          $(printf "$FAILS")— $(date -u '+%F %R UTC')"
              echo "incident" > "$STATE"; date +%s > "$STATED/last_alert"
            fi
          else
            if [ "$INC" = "incident" ]; then
              send "🟢 mikcloud DR — rétabli
          $(printf "$OKS")— $(date -u '+%F %R UTC')"
            fi
            echo "ok" > "$STATE"
            if [ "$HOUR" = "06" ] && [ ! -f "$STATED/heartbeat.$(date -u +%F)" ]; then
              send "🟢 mikcloud DR — heartbeat quotidien
          $(printf "$OKS")— $(date -u '+%F %R UTC')"
              touch "$STATED/heartbeat.$(date -u +%F)"
            fi
          fi
          printf 'fails=%s\nstate=%s\nat=%s\n' "$(printf "$FAILS" | grep -c . || true)" "$(cat "$STATE")" "$(date -u +%FT%TZ)" > "$STATUSF"
          exit 0
          MON_EOF
          sudo chmod 755 /usr/local/sbin/mikcloud-monitor
          CHATS=$(psql "$LOCALPG_DSN" -Atc "SELECT n.telegram_chat_id FROM notif_settings n LEFT JOIN accounts a ON a.id=n.account_id WHERE n.telegram_enabled=TRUE AND n.telegram_chat_id<>'' ORDER BY a.created_at NULLS LAST LIMIT 1")
          echo "chat d'alerte retenu: ${CHATS:-AUCUN} — monitor muet jusqu'au premier reverse-sync"
          sudo tee /etc/mikcloud/monitor.env > /dev/null <<MONEOF
          OPS_TELEGRAM_CHATS=$CHATS
          WEB_VITALS_RETENTION_DAYS=90
          MONEOF
          sudo chmod 600 /etc/mikcloud/monitor.env
          echo "═══ 4. Unités systemd ═══"
          sudo tee /etc/systemd/system/mikcloud-reverse-sync.service > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud reverse-sync local→Supabase→Neon (N°275)
          After=network-online.target postgresql.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/mikcloud-reverse-sync
          TimeoutStartSec=1800
          UNITEOF
          sudo tee /etc/systemd/system/mikcloud-reverse-sync.timer > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud reverse-sync nocturne (03:00 UTC)

          [Timer]
          OnCalendar=*-*-* 03:00:00 UTC
          Persistent=true
          RandomizedDelaySec=120

          [Install]
          WantedBy=timers.target
          UNITEOF
          sudo tee /etc/systemd/system/mikcloud-wal-upload.service > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud WAL → OCI Object Storage (N°275)
          After=network-online.target postgresql.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/mikcloud-wal-upload
          TimeoutStartSec=600
          UNITEOF
          sudo tee /etc/systemd/system/mikcloud-wal-upload.timer > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud WAL upload toutes les 5 minutes

          [Timer]
          OnCalendar=*:0/5
          AccuracySec=15s

          [Install]
          WantedBy=timers.target
          UNITEOF
          sudo tee /etc/systemd/system/mikcloud-monitor.service > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud monitor DR (N°275)
          After=network-online.target postgresql.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/mikcloud-monitor
          TimeoutStartSec=120
          UNITEOF
          sudo tee /etc/systemd/system/mikcloud-monitor.timer > /dev/null <<'UNITEOF'
          [Unit]
          Description=mikcloud monitor toutes les 15 minutes

          [Timer]
          OnCalendar=*:0/15
          Persistent=true

          [Install]
          WantedBy=timers.target
          UNITEOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now mikcloud-wal-upload.timer mikcloud-monitor.timer mikcloud-reverse-sync.timer >/dev/null 2>&1 || true
          echo "═══ 5. Vérifications ═══"
          systemctl list-timers --no-pager | grep mikcloud || echo "⚠ aucun timer mikcloud visible"
          sleep 20
          if sudo test -f /var/lib/mikcloud/wal-upload.status; then
            echo "--- wal-upload.status (premier passage) ---"
            sudo cat /var/lib/mikcloud/wal-upload.status
          else
            echo "premier upload pas encore passé (timer ≤5 min)"
          fi
          echo "═══ ARM-DR TERMINÉ — chaîne DR armée ═══"
          REMOTE

      - name: mode=reverse-sync — flux Tier2 immédiat (local→Supabase→Neon)
        if: ${{ env.RESOLVED_MODE == 'reverse-sync' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          sudo test -f /usr/local/sbin/mikcloud-reverse-sync || { echo "❌ arm-dr non exécuté — rien à déclencher"; exit 1; }
          echo "déclenchement du flux (service oneshot, synchrone)…"
          if sudo systemctl start mikcloud-reverse-sync.service; then
            echo "✅ service terminé OK"
          else
            echo "❌ service en échec — journal:"; sudo journalctl -u mikcloud-reverse-sync.service --since "-30 min" --no-pager | tail -40; exit 1
          fi
          echo "--- log (45 dernières lignes) ---"
          sudo tail -n 45 /var/log/mikcloud/reverse-sync.log
          echo "--- statut ---"
          sudo cat /var/lib/mikcloud/reverse-sync.status
          echo "--- comptages cibles ---"
          set -a; . <(sudo cat /etc/mikcloud/backup.env); set +a
          echo "Supabase: $(psql "$DATABASE_URL_SESSION" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'") tables"
          echo "Neon:     $(psql "$NEON_DATABASE_URL" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'") tables"
          REMOTE

      - name: mode=health — monitor une fois + API publique
        if: ${{ env.RESOLVED_MODE == 'health' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          if sudo test -f /usr/local/sbin/mikcloud-monitor; then
            sudo /usr/local/sbin/mikcloud-monitor || true
            echo "--- monitor.status ---"
            sudo cat /var/lib/mikcloud/monitor.status 2>/dev/null || true
          else
            echo "⚠ monitor non armé (arm-dr pas encore exécuté) — contrôle minimal"
            pg_isready -h 127.0.0.1 -p 5432 || true
            systemctl is-active mikcloud || true
          fi
          sudo test -f /var/lib/mikcloud/wal-upload.status && { echo "--- wal-upload.status ---"; sudo cat /var/lib/mikcloud/wal-upload.status; } || true
          sudo test -f /var/lib/mikcloud/reverse-sync.status && { echo "--- reverse-sync.status ---"; sudo cat /var/lib/mikcloud/reverse-sync.status; } || true
          echo "--- ressources ---"
          df -h / | sed -n '2p'; uptime
          REMOTE
          echo "── API publique (depuis le runner) ──"
          curl -fsS -o /dev/null -m 15 -w "api.mikcloud.ftci.fr HTTP %{http_code}\n" https://api.mikcloud.ftci.fr/ || echo "❌ API publique KO"
          curl -fsS -o /dev/null -m 15 -w "mikcloud.ftci.fr HTTP %{http_code}\n" https://mikcloud.ftci.fr || echo "❌ frontend KO"

      - name: mode=drill — restaurabilité démontrée (base jetable + WAL distant)
        if: ${{ env.RESOLVED_MODE == 'drill' }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          command -v oci >/dev/null 2>&1 || { echo "❌ OCI CLI absent — lancer mode=arm-dr d'abord"; exit 1; }
          sudo test -f /etc/mikcloud/walupload.env || { echo "❌ arm-dr non exécuté (walupload.env absent)"; exit 1; }
          set -a; . <(sudo cat /etc/mikcloud/localpg.env); set +a
          . <(sudo cat /etc/mikcloud/walupload.env)
          : "${LOCALPG_DSN:?}"; : "${WAL_NS:?}"; : "${WAL_BUCKET:?}"
          cleanup(){ sudo -u postgres psql -qc 'DROP DATABASE IF EXISTS mikcloud_drill WITH (FORCE)' || true; }
          trap 'cleanup; rm -f /tmp/mikcloud-drill-*.dump /tmp/mikcloud-drill-*.dump.list /tmp/drill.err /tmp/drill-seg* 2>/dev/null' EXIT
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "═══ 1. Dump frais du primaire local ═══"
          DUMP=/tmp/mikcloud-drill-$STAMP.dump
          pg_dump --schema=public --no-owner --no-privileges -Fc -f "$DUMP" "$LOCALPG_DSN"
          pg_restore --list "$DUMP" | grep -vE ' (SCHEMA|EXTENSION) ' > "$DUMP.list"
          echo "tables dans le dump: $(pg_restore --list "$DUMP" | grep -c ' TABLE ')"
          echo "═══ 2. Restore STRICT sur base jetable mikcloud_drill ═══"
          BASE_DSN="${LOCALPG_DSN%%/mikcloud*}"
          SUFFIX="${LOCALPG_DSN#*/mikcloud}"
          DRILL_DSN="${BASE_DSN}/mikcloud_drill${SUFFIX}"
          cleanup
          sudo -u postgres psql -qc 'CREATE DATABASE mikcloud_drill OWNER mikcloud'
          T1=$(date +%s)
          if ! pg_restore --exit-on-error --no-owner --no-privileges --use-list="$DUMP.list" -d "$DRILL_DSN" 2> /tmp/drill.err; then
            echo "❌ pg_restore drill ÉCHOUÉ :"; tail -25 /tmp/drill.err; exit 1
          fi
          echo "restore strict OK en $(( $(date +%s) - T1 )) s"
          echo "═══ 3. Asserts structure + données ═══"
          DT=$(psql "$DRILL_DSN" -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          echo "tables drill: $DT"
          [ "$DT" -ge 30 ] || { echo "❌ $DT tables seulement — restore incomplet"; exit 1; }
          DRILL_OK=yes
          for t in routers hotspot_users settings health_checkpoint; do
            S=$(psql "$LOCALPG_DSN" -Atc "SELECT count(*) FROM public.$t")
            D=$(psql "$DRILL_DSN" -Atc "SELECT count(*) FROM public.$t")
            echo "$t: primaire=$S drill=$D"
            [ "$D" -gt 0 ] || { echo "❌ table $t vide dans le drill"; DRILL_OK=; }
          done
          [ -n "$DRILL_OK" ] || { echo "❌ asserts données en échec"; exit 1; }
          echo "═══ 4. WAL distant lisible (Tier1.5) ═══"
          SEG=$(sudo sort /var/lib/mikcloud/wal-uploaded.list 2>/dev/null | tail -1 || true)
          if [ -n "${SEG:-}" ]; then
            oci --config-file /etc/oci/config os object get --namespace "$WAL_NS" --bucket-name "$WAL_BUCKET" --name "${SEG}.gz" --file /tmp/drill-seg.gz >/dev/null
            gunzip -c /tmp/drill-seg.gz > /tmp/drill-seg
            PGW=$(ls /usr/lib/postgresql/*/bin/pg_waldump 2>/dev/null | tail -1 || true)
            if [ -n "$PGW" ]; then
              echo "--- pg_waldump $SEG (extrait) ---"
              "$PGW" /tmp/drill-seg 2>/dev/null | head -3 || echo "⚠ pg_waldump n'a pas lu le segment"
            else
              echo "⚠ pg_waldump absent — lisibilité par taille seulement"
            fi
            echo "WAL distant OK: ${SEG}.gz ($(du -h /tmp/drill-seg | cut -f1) décompressé)"
            rm -f /tmp/drill-seg /tmp/drill-seg.gz
          else
            echo "⚠ aucun WAL uploadé — attendre le timer mikcloud-wal-upload puis relancer"
          fi
          echo "═══ 5. Vérification base backup distant ═══"
          oci --config-file /etc/oci/config os object list --namespace "$WAL_NS" --bucket-name "$WAL_BUCKET" --prefix basebackup/ --page-size 50 2>/dev/null \
            | jq -r '.data.objects[].name' 2>/dev/null | sort | tail -3 || echo "(aucun base backup — viendra avec le reverse-sync nocturne)"
          echo "═══ DRILL TERMINÉ — restaurabilité démontrée (primaire intact) ═══"
          REMOTE

      - name: Rapport
        if: always()
        run: |
          {
            echo "## ops-db-hybrid — mode: ${{ env.RESOLVED_MODE }}"
            echo ""
            echo "- Verdict: ${{ job.status }}"
            echo "- Date: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
