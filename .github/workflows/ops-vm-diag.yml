name: ops-vm-diag

# ═══ DIAGNOSTIC OCI DE L'INSTANCE FTECHCI (lecture seule + remise en route) ═══
#
# N°275 — créé pendant l'incident du 09/10 ~05:14 UTC : la VM ne répondait
# plus ni en SSH ni sur 443 (API publique en timeout), 3 échecs SSH
# consécutifs depuis les runners. Ce workflow interroge l'API OCI depuis le
# runner (chemin indépendant de la VM) :
#
#   1. état de l'instance (RUNNING / STOPPED / …) + shape ;
#   2. capture du serial console history (dernières lignes du noyau —
#      panic / OOM / shutdown y sont visibles) ;
#   3. si STOPPED : action START + attente RUNNING + healthcheck API
#      publique (la remise en route est explicite et tracée ici).
#
# PIÈGE consigné (run 22) : chaque `oci` reçoit </dev/null — le CLI lit/
# bufférise stdin et dévore les lignes suivantes d'un script `bash -s`.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diag (défaut, lecture seule) | postmortem (journal du boot figé via SSH) | reboot (SOFTRESET — prod down)"
        required: false
        default: "diag"
        type: string
      confirm:
        description: "Taper MIK-VM-START pour autoriser l'action START (si STOPPED) ou MIK-VM-REBOOT pour reboot"
        required: false
        default: ""
        type: string

concurrency:
  group: ops-vm-diag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      CONFIRM: ${{ inputs.confirm }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: OCI CLI + config (pattern chasse N°270-ter)
        run: |
          set -euo pipefail
          for v in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_REGION OCI_KEY; do
            [ -n "${!v}" ] || { echo "❌ secret $v absent"; exit 1; }
          done
          python3 -m pip install --quiet oci-cli \
            || python3 -m pip install --quiet --break-system-packages oci-cli
          mkdir -p ~/.oci
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          FP_CALC="$(openssl pkey -in ~/.oci/oci_api_key.pem -pubout -outform DER 2>/dev/null | openssl md5 | awk '{print $NF}' | tr -d ':')"
          FP_REF="$(echo "$OCI_FINGERPRINT" | tr -d ':')"
          [ "$FP_CALC" = "$FP_REF" ] || { echo "❌ empreinte clé ≠ fingerprint"; exit 1; }
          echo "auth OCI OK — region $OCI_REGION"

      - name: État des instances de la tenancy
        run: |
          set -euo pipefail
          oci compute instance list --compartment-id "$OCI_TENANCY" </dev/null \
            | jq -r '.data[] | [.["display-name"], .["lifecycle-state"], .["shape"], .id] | @tsv' \
            | tee /tmp/instances.tsv
          echo "---"
          # l'instance Ftechci (A1) — par shape A1 pour couvrir un rename éventuel
          grep -P '\tVM\.Standard\.A1\.Flex\t' /tmp/instances.tsv | head -3 > /tmp/a1.tsv
          [ -s /tmp/a1.tsv ] || { echo "❌ aucune A1 dans la tenancy"; exit 1; }
          NAME=$(cut -f1 /tmp/a1.tsv | head -1); STATE=$(cut -f2 /tmp/a1.tsv | head -1)
          IID=$(cut -f4 /tmp/a1.tsv | head -1)
          echo "INSTANCE=$NAME STATE=$STATE"
          echo "IID=$IID" >> "$GITHUB_ENV"
          echo "ISTATE=$STATE" >> "$GITHUB_ENV"

      - name: Serial console history (noyau — lecture, polling patient)
        run: |
          set -euo pipefail
          # capture NON FATALE (409 « instance is currently being modified »
          # possible si une capture précédente est en cours / instance en
          # transition — run 37) : le diagnostic ne doit jamais bloquer le
          # step de remise en route
          CAP=$(oci compute console-history capture --instance-id "$IID" </dev/null 2>/tmp/ch.err \
            | jq -r '.data.id') || { echo "⚠ capture console refusée :"; head -5 /tmp/ch.err; exit 0; }
          echo "capture: $CAP — polling de l'état…"
          for i in $(seq 1 20); do
            sleep 15
            ST=$(oci compute console-history get --instance-console-history-id "$CAP" </dev/null \
              | jq -r '.data["lifecycle-state"]')
            echo "[$i] $ST"
            [ "$ST" = "SUCCEEDED" ] && break
          done
          oci compute console-history get-content --instance-console-history-id "$CAP" \
            --file /tmp/console.txt </dev/null >/dev/null 2>&1 || true
          if [ -s /tmp/console.txt ]; then
            echo "═══ 400 dernières lignes du console history ═══"
            tail -n 400 /tmp/console.txt || true
          else
            echo "⚠ console history vide/indisponible"
          fi

      - name: mode=postmortem — journal du boot figé (-b -1) via SSH (N°280)
        if: ${{ inputs.action == 'postmortem' }}
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          VM_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          for v in SSH_KEY VM_HOST DEPLOY_USER; do
            [ -n "${!v}" ] || { echo "❌ secret/env $v absent"; exit 1; }
          done
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key && chmod 600 /tmp/oracle_key
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          ssh $SSH_OPTS "$DEPLOY_USER@$VM_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          echo "═══ boots récents (journal persistant) ═══"
          sudo journalctl --list-boots --no-pager 2>/dev/null | tail -6
          echo "═══ last -x (reboots / crashs) ═══"
          last -x reboot shutdown 2>/dev/null | head -8
          echo "═══ FIN du boot précédent — dernier état vivant (150 dernières lignes) ═══"
          sudo journalctl -b -1 -n 150 --no-pager 2>/dev/null | tail -150 \
            || echo "(journal -b -1 indisponible — journald volatil ?)"
          echo "═══ signaux noyau du boot précédent (oom/panic/hung/io/segv) ═══"
          sudo journalctl -b -1 --no-pager 2>/dev/null \
            | grep -iE 'out of memory|oom-kill|kernel panic|hung_task|blocked for more|I/O error|ext4.*error|segfault|killed process|watchdog' \
            | tail -40 \
            || echo "(aucun signal noyau retrouvé sur le boot précédent)"
          echo "═══ état actuel ═══"
          uptime
          systemctl --failed --no-pager --no-legend || true
          REMOTE

      - name: Action START si arrêtée (confirm MIK-VM-START)
        if: ${{ env.ISTATE != 'RUNNING' }}
        run: |
          set -euo pipefail
          echo "état actuel: $ISTATE"
          if [ "$CONFIRM" != "MIK-VM-START" ]; then
            echo "⚠ pas de START — relancer avec confirm=MIK-VM-START si souhaité"
            exit 0
          fi
          oci compute instance action --instance-id "$IID" --action START </dev/null \
            | jq -r '.data["lifecycle-state"]'
          echo "attente RUNNING…"
          for i in $(seq 1 20); do
            sleep 15
            S=$(oci compute instance get --instance-id "$IID" </dev/null | jq -r '.data["lifecycle-state"]')
            echo "[$i] $S"
            [ "$S" = "RUNNING" ] && break
          done
          echo "STATE_FINAL=$S" >> "$GITHUB_ENV"

      - name: REBOOT si prod down (action=reboot + confirm=MIK-VM-REBOOT[-HARD])
        if: ${{ inputs.action == 'reboot' }}
        run: |
          set -euo pipefail
          case "$CONFIRM" in
            MIK-VM-REBOOT)      ACT=SOFTRESET; ;;
            MIK-VM-REBOOT-HARD) ACT=RESET;     ;;   # dur — le hung ignore l'ACPI (run 38)
            *) echo "⚠ reboot refusé — confirm=MIK-VM-REBOOT ou MIK-VM-REBOOT-HARD requis"; exit 0 ;;
          esac
          echo "$ACT de l'instance hung…"
          oci compute instance action --instance-id "$IID" --action "$ACT" </dev/null \
            | jq -r '.data["lifecycle-state"]'
          SEEN_NONRUN=no
          for i in $(seq 1 28); do
            sleep 15
            S=$(oci compute instance get --instance-id "$IID" </dev/null | jq -r '.data["lifecycle-state"]')
            echo "[$i] $S"
            [ "$S" != "RUNNING" ] && SEEN_NONRUN=yes
            if [ "$S" = "RUNNING" ] && [ "$SEEN_NONRUN" = "yes" ]; then break; fi
          done
          echo "attente services (75 s)…"; sleep 75

      - name: Healthchecks post-action
        if: always()
        run: |
          set -uo pipefail
          sleep 20
          echo "── API publique (depuis le runner) ──"
          curl -fsS -o /dev/null -m 15 -w "api.mikcloud.ftci.fr HTTP %{http_code}\n" https://api.mikcloud.ftci.fr/ \
            || echo "❌ API publique KO"
          curl -fsS -o /dev/null -m 15 -w "mikcloud.ftci.fr HTTP %{http_code}\n" https://mikcloud.ftci.fr \
            || echo "❌ frontend KO"
          echo "── SSH ──"
          if [ -n "${SSH_KEY:-}" ] && [ -n "${VM_HOST:-}" ] && [ -n "${DEPLOY_USER:-}" ]; then
            printf '%s\n' "$SSH_KEY" > /tmp/oracle_key && chmod 600 /tmp/oracle_key
            ssh -i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$DEPLOY_USER@$VM_HOST" 'echo "SSH OK — $(hostname) — $(date -u +%FT%TZ)"; uptime' \
              || echo "❌ SSH injoignable"
          else
            echo "(SSH non testé — secrets non exposés à ce step)"
          fi
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          VM_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
