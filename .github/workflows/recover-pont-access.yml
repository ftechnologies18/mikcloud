name: recover-pont-access

# ═══ BRISURE-GLACE D'ACCÈS PONT E5 (N°237, 04/10/2026) ═══
# Contexte : le poste de pilotage (sandbox agent) a perdu son répertoire
# de pilotage (/home/z/.oci) lors d'un rollback filesystem — la clé SSH
# privée du pont n'existe PLUS QUE dans le secret ORACLE_SSH_KEY.
# Ce workflow ajoute la clé publique de pilotage v2 au authorized_keys
# du pont, ce qui restaure l'accès SSH de l'agent.
#
# Sécurité : la clé ajoutée est PUBLIQUE (aucun secret dans les logs) ;
# déclenchement workflow_dispatch UNIQUEMENT (jamais push/PR — personne
# d'autre que le propriétaire ne peut l'invoquer) ; permissions {} (ce
# workflow n'écrit RIEN côté GitHub). Idempotent (grep -qF avant ajout).
# La clé historique (ORACLE_SSH_KEY) reste en place : deploy-oracle.yml
# en dépend.
#
# Après usage : conserver comme brisure-glace documenté, ou supprimer.

on:
  workflow_dispatch: {}

permissions: {} # SSH uniquement — aucune écriture GitHub requise

jobs:
  recover:
    name: Ajout clé pilotage v2 au pont E5
    runs-on: ubuntu-latest
    steps:
      - name: SSH vers le pont (secret ORACLE_SSH_KEY) + ajout de la clé
        env:
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          ssh -i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@84.12.85.241" bash -s <<'REMOTE'
          set -euo pipefail
          NEW_PUB="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBjY8iZF9IP0V28oL3MJsq1SFs6P/vqnyZydinXz1Q9e"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          if grep -qF "$NEW_PUB" ~/.ssh/authorized_keys; then
            echo "Clé v2 déjà présente — rien à faire (idempotent)."
          else
            echo "$NEW_PUB" >> ~/.ssh/authorized_keys
            echo "Clé v2 AJOUTÉE au pont."
          fi
          echo "── authorized_keys du pont :"
          cat ~/.ssh/authorized_keys
          REMOTE
