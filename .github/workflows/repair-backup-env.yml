name: repair-backup-env

# ═══ RÉPARATION DU COFFRE-FORT NEON DU PONT (N°243, 04/10/2026) ═══
# Contexte : le pont E5 reconstruit le 03/10 (N°237-238) a reçu le
# TEMPLATE commenté de /etc/mikcloud/backup.env (bootstrap.sh l.81-85,
# comportement voulu) mais l'étape opérateur « remplir les 2 DSN »
# (message final du bootstrap, point 2) n'a jamais été faite → 1er run
# nocturne du timer (04/10 03:00 UTC) échoué : « DATABASE_URL_SESSION
# requis dans backup.env ».
#
# Ce workflow restaure le fichier depuis les pièces du dépôt :
#   - DATABASE_URL_SESSION : copie SERVEUR du DATABASE_URL du pont
#     (mikcloud.env le tient déjà en forme session :5432 — la valeur
#     ne transite JAMAIS par le réseau) ;
#   - NEON_DATABASE_URL : secret NEON_STANDBY_DATABASE_URL, transmis
#     par STDIN vers un fichier 600 côté pont (jamais en argv ni dans
#     les logs) ; endpoint DIRECT dérivé si le secret est poolé
#     (suffixe -pooler retiré) ; sslmode=require ajouté si absent.
#
# Il installe AUSSI postgresql-client-17 (dépôt PGDG officiel) : le
# serveur Supabase est en 17.6 et le pg_dump d'Ubuntu 24.04 (16.15)
# REFUSE de dumper un serveur plus récent que lui (run 1 : « server
# version mismatch ») — idem après atterrissage A1/micro (même image
# Ubuntu, bootstrap n'installe que postgresql-client, i.e. la 16).
#
# Il réinstalle ENFIN le script /usr/local/sbin/mikcloud-backup ET son
# unité systemd (TimeoutStartSec explicite, N°243-d) depuis le dépôt —
# source de vérité unique, vérifiés par grep avant installation.
#
# Il termine par un TEST IMMÉDIAT (systemctl start mikcloud-backup,
# oneshot) : pg_dump Supabase → psql Neon avec ON_ERROR_STOP — le
# verdict du run Actions EST le verdict du coffre-fort.
#
# Sécurité : workflow_dispatch UNIQUEMENT ; permissions {} (aucune
# écriture GitHub) ; aucun secret écho (masquage sed des DSN dans les
# sorties journalctl, par principe).
# Réutilisation : après l'atterrissage A1 ou micro (le cloud-init
# repose le template commenté), re-dispatcher ce workflow pour
# ré-armer le coffre-fort sur la nouvelle instance.

on:
  workflow_dispatch: {}

permissions:
  contents: read # checkout uniquement (lecture du dépôt) — aucune écriture

jobs:
  repair:
    name: Restaure backup.env + script + unité à jour + test du snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Transfert du DSN Neon (STDIN) puis réparation + test sur le pont
        env:
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          NEON_DSN: ${{ secrets.NEON_STANDBY_DATABASE_URL }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          # DSN Neon → STDIN du pont (umask 077 : fichier créé 600, jamais en argv/logs)
          printf '%s' "$NEON_DSN" | ssh -i /tmp/oracle_key \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@84.12.85.241" 'umask 077; cat > /tmp/.neon-dsn'
          # Script du coffre-fort (source de vérité = dépôt) → STDIN du pont.
          # Run 2 : le restore a buté sur CREATE EXTENSION supabase_vault
          # (refusée par Neon) → la version du dépôt filtre ces lignes.
          # Run 3 : le restore base entière a buté sur la clause SUSET
          # « SET log_min_messages » de realtime.list_changes (refusée au
          # rôle non-superuser Neon) → la version du dépôt scope le dump
          # au schéma public (N°243-d, données applicatives uniquement).
          ssh -i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@84.12.85.241" 'umask 077; cat > /tmp/mikcloud-backup.new' \
            < deploy/oracle/backup-neon.sh
          # Unité systemd du coffre-fort (TimeoutStartSec explicite, N°243-d —
          # le script retente jusqu'à 3× une coupure transitoire du pooler
          # Supabase : le défaut système 90 s tuerait la reprise) → STDIN.
          ssh -i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@84.12.85.241" 'umask 077; cat > /tmp/mikcloud-backup.service.new' \
            < deploy/oracle/mikcloud-backup.service
          ssh -i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$DEPLOY_USER@84.12.85.241" bash -s <<'REMOTE'
          set -euo pipefail
          # 0) prérequis
          command -v psql >/dev/null
          test -s /tmp/.neon-dsn || { echo "ERREUR: DSN Neon non transmis"; exit 1; }
          # 0-bis) pg_dump doit être ≥ 17 (serveur Supabase 17.6 — run 1 :
          # « aborting because of server version mismatch » avec la 16.15
          # d'Ubuntu). Dépôt PGDG officiel si la 17 n'est pas déjà là.
          PGMAJ() { pg_dump --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+' | head -1 | cut -d. -f1; }
          if [ "$(PGMAJ || echo 0)" -lt 17 ] 2>/dev/null; then
            echo "── pg_dump $(pg_dump --version | grep -oE '[0-9]+\.[0-9]+' | head -1) < 17 → installation postgresql-client-17 (PGDG)…"
            if [ ! -f /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc ]; then
              sudo install -d /usr/share/postgresql-common/pgdg
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
              sudo install -m 644 /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            fi
            if [ ! -f /etc/apt/sources.list.d/pgdg.list ]; then
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-17
          fi
          pg_dump --version
          [ "$(PGMAJ)" -ge 17 ] || { echo "ERREUR: pg_dump toujours < 17"; exit 1; }
          # 0-ter) script du coffre-fort à jour (dépôt = source de vérité)
          test -s /tmp/mikcloud-backup.new || { echo "ERREUR: script backup non transmis"; exit 1; }
          bash -n /tmp/mikcloud-backup.new
          grep -q 'supabase_vault' /tmp/mikcloud-backup.new \
            || { echo "ERREUR: le script transmis ne contient pas le filtre supabase_vault"; exit 1; }
          grep -q -- '--schema=public' /tmp/mikcloud-backup.new \
            || { echo "ERREUR: le script transmis ne scope pas le dump au schéma public (N°243-d)"; exit 1; }
          grep -q 'MAX_ATTEMPTS' /tmp/mikcloud-backup.new \
            || { echo "ERREUR: le script transmis n'a pas la reprise sur coupure transitoire (N°243-d)"; exit 1; }
          grep -q 'DUMP_FILE' /tmp/mikcloud-backup.new \
            || { echo "ERREUR: le script transmis n'a pas le découplage dump/restore en deux phases (N°243-d)"; exit 1; }
          # 0-ter-bis) unité systemd à jour (TimeoutStartSec pour la reprise)
          test -s /tmp/mikcloud-backup.service.new || { echo "ERREUR: unité systemd non transmise"; exit 1; }
          grep -q '^TimeoutStartSec=' /tmp/mikcloud-backup.service.new \
            || { echo "ERREUR: l'unité transmise n'a pas de TimeoutStartSec explicite (N°243-d)"; exit 1; }
          sudo install -o root -g root -m 644 /tmp/mikcloud-backup.service.new /etc/systemd/system/mikcloud-backup.service
          rm -f /tmp/mikcloud-backup.service.new
          sudo install -o root -g root -m 750 /tmp/mikcloud-backup.new /usr/local/sbin/mikcloud-backup
          rm -f /tmp/mikcloud-backup.new
          echo "OK — /usr/local/sbin/mikcloud-backup + unité systemd installés depuis le dépôt (filtre supabase_vault + scope public + reprise transitoire inclus)."
          # 1) DSN Neon → endpoint DIRECT (retirer -pooler si le secret est poolé)
          NEON="$(cat /tmp/.neon-dsn)"
          if printf '%s' "$NEON" | grep -q -- '-pooler\.'; then
            NEON="$(printf '%s' "$NEON" | sed 's/-pooler\././')"
            echo "Secret poolé → endpoint DIRECT dérivé (suffixe -pooler retiré)."
          fi
          case "$NEON" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
          printf '%s' "$NEON" | grep -q 'sslmode=' || NEON="${NEON}${SEP}sslmode=require"
          # 2) DSN session Supabase : copie serveur du DATABASE_URL du pont (:5432)
          DBURL="$(sudo grep -E '^DATABASE_URL=' /etc/mikcloud/mikcloud.env | head -1 | cut -d= -f2-)"
          case "$DBURL" in
            postgresql://*pooler.supabase.com:5432/*) ;;
            *) echo "ERREUR: DATABASE_URL du pont n'est pas la forme session :5432 attendue"; exit 1 ;;
          esac
          # 3) assemblage + installation (640 root:mikcloud, comme bootstrap.sh)
          umask 077
          {
            echo "# Coffre-fort Neon (docs/MIGRATION-ORACLE.md §7) — restauré par repair-backup-env"
            echo "DATABASE_URL_SESSION=${DBURL}"
            printf 'NEON_DATABASE_URL=%s\n' "$NEON"
          } > /tmp/backup.env.new
          grep -qE '^NEON_DATABASE_URL=postgresql://[^ ]+neon\.tech/' /tmp/backup.env.new \
            || { echo "ERREUR: forme du DSN Neon inattendue"; exit 1; }
          sudo install -o root -g mikcloud -m 640 /tmp/backup.env.new /etc/mikcloud/backup.env
          rm -f /tmp/backup.env.new /tmp/.neon-dsn
          echo "OK — /etc/mikcloud/backup.env restauré (2 DSN, perms 640 root:mikcloud)."
          # 4) test immédiat du coffre-fort (pg_dump Supabase → psql Neon)
          #    (le || true laisse la branche de diagnostic tourner — run 1 :
          #    set -e tuait le script avant l'affichage du journal masqué)
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mikcloud-backup.service 2>/dev/null || true
          sudo systemctl start mikcloud-backup.service || true
          if systemctl is-failed mikcloud-backup.service >/dev/null 2>&1; then
            echo "ÉCHEC du snapshot test — journal (DSN masqués) :"
            sudo journalctl -u mikcloud-backup.service -n 10 --no-pager \
              | sed -E 's#(postgresql://)[^ ]+@#\1***@#g'
            exit 1
          fi
          echo "── Snapshot test : SUCCÈS (Supabase → Neon)."
          sudo journalctl -u mikcloud-backup.service -n 4 --no-pager \
            | sed -E 's#(postgresql://)[^ ]+@#\1***@#g'
          echo "── Timer nocturne (03:00 UTC) : $(systemctl is-enabled mikcloud-backup.timer)"
          REMOTE
          rm -f /tmp/oracle_key
