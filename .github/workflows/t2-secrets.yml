name: t2-secrets

# ═══ T2 — ROTATION DES SECRETS POUR LA BASCULE VERS LE PONT (N°244) ═══
# Contexte : la facture Render de septembre (~16 €, impayable — app en
# essai sans revenu) suspend le service Render au 16/10. La bascule T2
# (docs/MIGRATION-ORACLE.md §5.2/§8-bis) ne peut PAS attendre la capture
# A1 : le PONT E5 (IP réservée 84.12.85.241) devient la production par
# simple flip DNS Cloudflare. Ce workflow exécute l'étape 4 de la
# checklist §8 (rotation des secrets) SUR LE PONT, en deux phases
# dispatchables séparément — doctrine : zéro secret dans le repo, zéro
# valeur échoée dans les logs (GitHub masque de toute façon la valeur
# du secret SUPABASE_DSN_NEW).
#
# ── Phase JWT (input rotate_jwt, défaut vrai) — exécutable à TOUT moment
#    (le pont est idle pré-flip : zéro impact production) :
#    1. ÉPINGLER CREDENTIALS_KEY = HKDF(JWT_SECRET actuel) AVANT toute
#       rotation — sinon les credentials RouterOS chiffrés au repos
#       deviendraient indéchiffrables (secretbox.Init dérive la clé de
#       JWT_SECRET quand CREDENTIALS_KEY est vide — utilitaire
#       backend/cmd/mikderive, même dérivation que le binaire) ;
#    2. JWT_SECRET neuf (openssl rand -hex 32) : les sessions console
#       sont révoquées à la BASCULE (les tokens sont vérifiés par la
#       machine qui sert le domaine), les utilisateurs se reconnectent,
#       les mots de passe ne changent pas ;
#    3. restart + healthcheck patient (~37 tables Supabase, ~1 min).
#    ADMIN_PASSWORD : PAS de nouvelle rotation — déjà rotée proprement
#    le 01/10 (RUNBOOK-SECRETS §2.8), jamais exposée au chat, déjà
#    synchronisée sur le pont par l'ancien sync Render→VM.
#
# ── Phase DSN (input rotate_dsn, défaut faux) — À exécuter DANS la
#    fenêtre de bascule, APRÈS les 2 gestes opérateur :
#      (a) dashboard Supabase → Project Settings → Database → Reset
#          database password (le reset n'est PAS scriptable : verdict
#          mesuré §2.8 — ALTER ROLE refusé au rôle applicatif) ;
#      (b) dépôt du nouveau DSN dans le secret SUPABASE_DSN_NEW
#          (repo → Settings → Secrets → Actions) — le chat est exclu
#          par doctrine (§0 du RUNBOOK-SECRETS).
#    Puis le workflow :
#    1. normalise le DSN en forme pooler SESSION :5432 sans paramètres
#       (forme en vigueur sur le pont — cf. repair-backup-env) et
#       REFUSE s'il est identique à l'actuel (reset pas fait ?) ;
#    2. teste la connexion (SELECT 1) AVANT de toucher au pont ;
#    3. remplace DATABASE_URL dans /etc/mikcloud/mikcloud.env ET
#       DATABASE_URL_SESSION dans /etc/mikcloud/backup.env — le timer
#       nocturne 03:00 UTC du coffre-fort lit backup.env, les DEUX
#       doivent suivre ;
#    4. restart + healthcheck + SNAPSHOT TEST IMMÉDIAT (Supabase →
#       Neon, verdict du run = verdict du coffre-fort) ;
#    5. met à jour les secrets GitHub DATABASE_URL + SUPABASE_DATABASE_URL
#       (backup.yml hebdo et standby-restore.yml lisent l'ANCIEN DSN —
#       mort après le reset) via l'API (sealed box PyNaCl) avec
#       MIKCLOUD_HUNT_TOKEN ; repli documenté si le jeton n'a pas les
#       droits : collage manuel dans les 2 secrets ;
#    6. met à jour la variable DATABASE_URL de Render par API (PUT en
#       bloc, une seule variable modifiée — pattern §2.8) + redéploiement
#       déclenché : Render redevient un standby SAIN (nouveau DSN
#       appliqué au boot) — le chemin de rollback §9.2 reste fonctionnel.
#
# Ordre de la fenêtre T2 (§8-bis du runbook) : reset Supabase → secret
# SUPABASE_DSN_NEW → dispatch phase DSN → flip DNS Cloudflare (CNAME
# api → A record 84.12.85.241, nuage GRIS) → validations post-flip.
# Le pont restant idle pré-flip, chaque phase peut être rejouée sans
# impact production.

on:
  workflow_dispatch:
    inputs:
      rotate_jwt:
        description: "Phase JWT — épinglage CREDENTIALS_KEY + JWT_SECRET neuf"
        type: boolean
        default: true
      rotate_dsn:
        description: "Phase DSN — après reset Supabase + secret SUPABASE_DSN_NEW"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # issue de synthèse (traçabilité opérateur — aucune valeur)

concurrency:
  group: t2-secrets
  # Jamais deux rotations superposées : la 2e attend la 1re.
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotation des secrets du pont (fenêtre T2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build de mikderive (dérivation CREDENTIALS_KEY — N°244)
        run: |
          cd backend
          go build -o /tmp/mikderive ./cmd/mikderive
          printf 'jwt-de-auto-controle' | /tmp/mikderive | grep -qE '^[0-9a-f]{64}$' \
            && echo "mikderive opérationnel."

      - name: Clé SSH + relevé de l'env actuel du pont (jamais échoé)
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/oracle_key
          printf '%s\n' "$SSH_KEY" > /tmp/oracle_key
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          # sudo cat : l'ubuntu n'a pas les droits 640 root:mikcloud.
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" 'sudo cat /etc/mikcloud/mikcloud.env' \
            > /tmp/mikcloud.env.pull
          chmod 600 /tmp/mikcloud.env.pull
          grep -q '^DATABASE_URL=' /tmp/mikcloud.env.pull \
            || { echo "ERREUR: DATABASE_URL introuvable dans l'env du pont"; exit 1; }
          echo "Env relevé ($(wc -l < /tmp/mikcloud.env.pull) lignes) — valeurs jamais affichées."

      # ═══════════════════ PHASE JWT ═══════════════════
      - name: Phase JWT — épinglage CREDENTIALS_KEY + rotation JWT_SECRET
        if: inputs.rotate_jwt == true
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          JWT_OLD="$(grep -E '^JWT_SECRET=' /tmp/mikcloud.env.pull | head -1 | cut -d= -f2-)"
          [ -n "$JWT_OLD" ] || { echo "ERREUR: JWT_SECRET introuvable dans l'env du pont"; exit 1; }
          if grep -qE '^CREDENTIALS_KEY=.{64}' /tmp/mikcloud.env.pull; then
            echo "CREDENTIALS_KEY déjà posée (64 hex) — épinglage inutile, rotation directe."
          else
            CRED="$(printf '%s' "$JWT_OLD" | /tmp/mikderive)"
            printf '%s' "$CRED" | grep -qE '^[0-9a-f]{64}$' \
              || { echo "ERREUR: dérivation HKDF inattendue"; exit 1; }
            if grep -qE '^CREDENTIALS_KEY=' /tmp/mikcloud.env.pull; then
              sed -i -e "s|^CREDENTIALS_KEY=.*|CREDENTIALS_KEY=$CRED|" /tmp/mikcloud.env.pull
            else
              printf 'CREDENTIALS_KEY=%s\n' "$CRED" >> /tmp/mikcloud.env.pull
            fi
            echo "CREDENTIALS_KEY épinglée (clé dérivée de l'ANCIEN JWT_SECRET) — les credentials chiffrés restent déchiffrables."
          fi
          JWT_NEW="$(openssl rand -hex 32)"
          sed -i -e "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_NEW|" /tmp/mikcloud.env.pull
          # Garde-fous : une seule occurrence de chaque, valeurs non vides.
          [ "$(grep -c '^JWT_SECRET=' /tmp/mikcloud.env.pull)" = "1" ]
          [ "$(grep -c '^CREDENTIALS_KEY=' /tmp/mikcloud.env.pull)" = "1" ]
          grep -qE '^JWT_SECRET=.{64}$' /tmp/mikcloud.env.pull
          echo "Nouveau JWT_SECRET généré (64 hex) — sessions console révoquées à la bascule."
          scp $SSH_OPTS /tmp/mikcloud.env.pull "$DEPLOY_USER@$ORACLE_HOST:/tmp/mikcloud.env.new"
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            sudo install -o root -g mikcloud -m 640 /tmp/mikcloud.env.new /etc/mikcloud/mikcloud.env &&
            rm -f /tmp/mikcloud.env.new
          '
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            sudo systemctl restart mikcloud &&
            i=0 &&
            until curl -fsS -o /dev/null http://127.0.0.1:4000/; do
              i=$((i+1));
              if [ "$i" -ge 60 ]; then
                echo "BACKEND KO après 10 min — journal (30 dernières lignes) :" >&2;
                sudo journalctl -u mikcloud -n 30 --no-pager >&2;
                exit 1;
              fi;
              sleep 10;
            done &&
            echo "BACKEND OK — phase JWT appliquée (healthcheck au bout de $((i*10)) s)."
          '
          # Le pont relit son env au restart : re-lever pour la phase DSN éventuelle.
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" 'sudo cat /etc/mikcloud/mikcloud.env' \
            > /tmp/mikcloud.env.pull
          chmod 600 /tmp/mikcloud.env.pull

      # ═══════════════════ PHASE DSN ═══════════════════
      - name: Phase DSN — nouveau DSN Supabase (reset opérateur fait au préalable)
        if: inputs.rotate_dsn == true
        env:
          DSN_NEW: ${{ secrets.SUPABASE_DSN_NEW }}
          HUNT_TOKEN: ${{ secrets.MIKCLOUD_HUNT_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/oracle_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          if [ -z "$DSN_NEW" ]; then
            echo "ERREUR: secret SUPABASE_DSN_NEW absent."
            echo "Gestes préalables : (a) dashboard Supabase → Project Settings →"
            echo "Database → Reset database password ; (b) repo → Settings → Secrets"
            echo "and variables → Actions → New repository secret → SUPABASE_DSN_NEW"
            echo "(collez la chaîne « Connection pooling » affichée — Session ou"
            echo "Transaction, la normalisation s'en charge)."
            exit 1
          fi
          # 1) Normalisation : forme pooler SESSION :5432 SANS paramètres
          #    (forme en vigueur sur le pont — repair-backup-env l'exige ;
          #    l'application ajoute sslmode=verify-full elle-même : piège §10-5,
          #    JAMAIS de sslmode dans le DSN).
          case "$DSN_NEW" in
            postgresql://*pooler.supabase.com*) ;;
            *)
              echo "ERREUR: le DSN collé n'est pas la forme pooler Supabase."
              echo "Collez la chaîne « Connection pooling » du dashboard (pas la"
              echo "chaîne directe db.*.supabase.co)."
              exit 1 ;;
          esac
          DSN_NORM="$(printf '%s' "$DSN_NEW" | sed -E 's/\?.*$//' | sed -E 's#:[0-9]+/postgres$#:5432/postgres#')"
          printf '%s' "$DSN_NORM" | grep -qE '^postgresql://[^ ]+@[^ ]+pooler\.supabase\.com:5432/postgres$' \
            || { echo "ERREUR: normalisation du DSN inattendue."; exit 1; }
          # 2) Garde anti-oubli : DSN identique à l'actuel = reset pas fait.
          DSN_NOW="$(grep -E '^DATABASE_URL=' /tmp/mikcloud.env.pull | head -1 | cut -d= -f2-)"
          if [ "$DSN_NORM" = "$DSN_NOW" ]; then
            echo "ERREUR: le DSN collé est IDENTIQUE à l'actuel — avez-vous bien"
            echo "exécuté « Reset database password » côté Supabase AVANT le dispatch ?"
            exit 1
          fi
          # 3) Test de connexion AVANT de toucher au pont.
          if ! PSQL_OUT="$(psql "$DSN_NORM" -tAc 'SELECT 1' 2>&1)"; then
            echo "ERREUR: le nouveau DSN ne se connecte pas — reset ou secret à revoir :"
            printf '%s\n' "$PSQL_OUT" | sed -E 's#(postgresql://)[^ ]+@#\1***@#g'
            exit 1
          fi
          echo "Nouveau DSN validé (SELECT 1 OK) — application sur le pont…"
          # 4) mikcloud.env : DATABASE_URL neuf (env re-relevé si la phase JWT a tourné).
          sed -i -e "s|^DATABASE_URL=.*|DATABASE_URL=$DSN_NORM|" /tmp/mikcloud.env.pull
          grep -qF "DATABASE_URL=$DSN_NORM" /tmp/mikcloud.env.pull
          # 5) backup.env : DATABASE_URL_SESSION neuf, NEON_DATABASE_URL conservé.
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" 'sudo cat /etc/mikcloud/backup.env' > /tmp/backup.env.pull
          chmod 600 /tmp/backup.env.pull
          NEON_LINE="$(grep -E '^NEON_DATABASE_URL=' /tmp/backup.env.pull | head -1)"
          [ -n "$NEON_LINE" ] || { echo "ERREUR: NEON_DATABASE_URL introuvable dans backup.env"; exit 1; }
          {
            echo "# Coffre-fort Neon (docs/MIGRATION-ORACLE.md §7) — DSN session roté par t2-secrets (N°244)"
            echo "DATABASE_URL_SESSION=$DSN_NORM"
            printf '%s\n' "$NEON_LINE"
          } > /tmp/backup.env.new
          chmod 600 /tmp/backup.env.new
          # 6) Dépôt + restart + healthcheck patient.
          scp $SSH_OPTS /tmp/mikcloud.env.pull "$DEPLOY_USER@$ORACLE_HOST:/tmp/mikcloud.env.new"
          scp $SSH_OPTS /tmp/backup.env.new "$DEPLOY_USER@$ORACLE_HOST:/tmp/backup.env.new2"
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            sudo install -o root -g mikcloud -m 640 /tmp/mikcloud.env.new /etc/mikcloud/mikcloud.env &&
            sudo install -o root -g mikcloud -m 640 /tmp/backup.env.new2 /etc/mikcloud/backup.env &&
            rm -f /tmp/mikcloud.env.new /tmp/backup.env.new2 &&
            sudo systemctl restart mikcloud &&
            i=0 &&
            until curl -fsS -o /dev/null http://127.0.0.1:4000/; do
              i=$((i+1));
              if [ "$i" -ge 60 ]; then
                echo "BACKEND KO après 10 min — journal :" >&2;
                sudo journalctl -u mikcloud -n 30 --no-pager | sed -E "s#(postgresql://)[^ ]+@#\1***@#g" >&2;
                exit 1;
              fi;
              sleep 10;
            done &&
            echo "BACKEND OK — nouveau DSN appliqué (healthcheck au bout de $((i*10)) s)."
          '
          # 7) Snapshot test immédiat : verdict du run = verdict du coffre-fort.
          ssh $SSH_OPTS "$DEPLOY_USER@$ORACLE_HOST" '
            sudo systemctl reset-failed mikcloud-backup.service 2>/dev/null || true
            sudo systemctl start mikcloud-backup.service || true
            if systemctl is-failed mikcloud-backup.service >/dev/null 2>&1; then
              echo "ÉCHEC du snapshot test — journal (DSN masqués) :" >&2
              sudo journalctl -u mikcloud-backup.service -n 10 --no-pager \
                | sed -E "s#(postgresql://)[^ ]+@#\1***@#g" >&2
              exit 1
            fi
            echo "── Snapshot test : SUCCÈS (Supabase → Neon, DSN neuf bout-en-bout)."
          '
          # 8) Secrets GitHub : DATABASE_URL (backup.yml hebdo) et
          #    SUPABASE_DATABASE_URL (standby-restore.yml) lisent l'ancien
          #    DSN — mort après le reset. Mise à jour par sealed box.
          python3 -m pip install --quiet pynacl 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pynacl
          if python3 - "$DSN_NORM" <<'PY'
          import base64, json, os, sys, urllib.request
          from nacl import encoding, public
          dsn = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["HUNT_TOKEN"]
          def api(path, data=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={"Authorization": f"Bearer {tok}",
                           "Accept": "application/vnd.github+json"},
                  data=json.dumps(data).encode() if data else None,
                  method="PUT" if data else "GET")
              with urllib.request.urlopen(req) as r:
                  return r.status
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
                  headers={"Authorization": f"Bearer {tok}",
                           "Accept": "application/vnd.github+json"})) as r:
                  pk = json.load(r)
              sealed = public.SealedBox(
                  public.PublicKey(pk["key"].encode(), encoding.Base64Encoder()))
              for name in ("DATABASE_URL", "SUPABASE_DATABASE_URL"):
                  # N°244-b : encrypted_value = BASE64 du chiffré binaire
                  # (jamais .decode("ascii") direct — UnicodeDecodeError ;
                  # pattern aligné sur ops/oct1/step8-flip-secret.py:98).
                  body = {"encrypted_value": base64.b64encode(
                              sealed.encrypt(dsn.encode())).decode("utf-8"),
                          "key_id": pk["key_id"]}
                  status = api(f"actions/secrets/{name}", body)
                  print(f"secret {name} mis à jour (HTTP {status})")
              sys.exit(0)
          except Exception as e:
              print(f"NOTE: mise à jour des secrets GitHub impossible ({e}).")
              print("REPLI MANUEL : collez le nouveau DSN dans les secrets")
              print("DATABASE_URL et SUPABASE_DATABASE_URL (Settings → Secrets →")
              print("Actions) — sinon backup.yml et standby-restore.yml échoueront.")
              sys.exit(0)  # non fatal : le repli est documenté
          PY
          then echo "Secrets GitHub à jour."; else echo "Secrets GitHub : voir la note ci-dessus (repli manuel)."; fi
          # 9) Render : DATABASE_URL mis à jour (PUT en bloc — pattern §2.8)
          #    + redéploiement déclenché → standby sain sur le nouveau DSN
          #    (chemin de rollback §9.2 fonctionnel après le flip).
          if [ -n "$RENDER_API_KEY" ]; then
            SVC_ID="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              https://api.render.com/v1/services \
              | jq -r '[.[] | (.service // .) | select((.type // "") | startswith("web"))][0].id')"
            if [ -n "$SVC_ID" ] && [ "$SVC_ID" != "null" ]; then
              curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$SVC_ID/env-vars?limit=100" \
                | jq --arg dsn "$DSN_NORM" \
                  '[(.[] | (.envVar // .) | select(.key != null))
                    | if .key == "DATABASE_URL" then .value = $dsn else . end]' \
                > /tmp/render-env.json
              PUT_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
                --data @/tmp/render-env.json \
                "https://api.render.com/v1/services/$SVC_ID/env-vars")"
              echo "Render DATABASE_URL : PUT HTTP $PUT_CODE (bloc complet, 1 variable modifiée)."
              DEP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/services/$SVC_ID/deploys")"
              echo "Render redéploiement : HTTP $DEP_CODE (standby sain sur le nouveau DSN)."
            else
              echo "NOTE: service Render introuvable — étape Render ignorée (non bloquante)."
            fi
          else
            echo "NOTE: RENDER_API_KEY absent — étape Render ignorée (non bloquante)."
          fi

      - name: Issue de synthèse (traçabilité — aucune valeur)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PHASES=""
          if [ "${{ inputs.rotate_jwt }}" = "true" ]; then
            PHASES="$PHASES
          - ✅ Phase JWT : CREDENTIALS_KEY épinglée (HKDF de l'ancien JWT_SECRET) + JWT_SECRET neuf + healthcheck OK"
          fi
          if [ "${{ inputs.rotate_dsn }}" = "true" ]; then
            PHASES="$PHASES
          - ✅ Phase DSN : DATABASE_URL + backup.env rotés, snapshot test Supabase→Neon OK, secrets GitHub + env Render mis à jour"
          fi
          gh issue create --title "T2 (N°244) — Secrets du pont rotés ${{ github.run_id }}" --body "$(cat <<EOF
          Rotation pré-bascule exécutée par \`t2-secrets.yml\` (run ${{ github.run_id }}).
          $PHASES

          ADMIN_PASSWORD : pas de nouvelle rotation (déjà rotée proprement le 01/10 — RUNBOOK-SECRETS §2.8).

          PROCHAINE ÉTAPE : flip DNS Cloudflare (CNAME \`api\` → A record \`84.12.85.241\`,
          nuage GRIS) puis validations §8-bis — cf. docs/MIGRATION-ORACLE.md.
          Aucune valeur de secret n'apparaît ici ni dans les logs du run.
          EOF
          )" || echo "NOTE: issue non créée (non bloquant)."
