<!DOCTYPE html>
<html lang="fr">
<head>
    <title id="title">Redirection...</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width; initial-scale=1.0; maximum-scale=1.0;"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-1: #0a1929; --bg-2: #102a43; --bg-3: #0d3b3e;
            --primary: #14b8a6; --primary-dark: #0d9488;
            --success: #10b981;
            --accent: #f59e0b;
            --glass-bg: rgba(255,255,255,0.97);
            --text: #1f2937; --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(90px);
            opacity: 0.4; z-index: 0; pointer-events: none;
        }
        .bg-blob.b1 { width: 380px; height: 380px; background: var(--primary); top: -120px; left: -120px; animation: float1 14s ease-in-out infinite; }
        .bg-blob.b2 { width: 320px; height: 320px; background: var(--success); bottom: -120px; right: -120px; animation: float2 16s ease-in-out infinite; }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,-30px); } }

        .redirect-card {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 22px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            text-align: center;
            max-width: 400px; width: 90%;
            animation: popIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }

        .success-ring {
            width: 100px; height: 100px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 0 8px rgba(16,185,129,0.15), 0 10px 30px rgba(16,185,129,0.3);
        }
        .success-ring::before {
            content: '';
            position: absolute; inset: -4px;
            border: 3px solid var(--success);
            border-radius: 50%;
            opacity: 0.35;
            animation: ringPulse 1.8s ease-out infinite;
        }
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .success-icon {
            font-size: 3rem;
            color: var(--success);
            animation: checkPop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) 0.2s both;
        }
        @keyframes checkPop {
            0% { transform: scale(0); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .redirect-card h3 {
            font-weight: 800; margin: 0 0 0.5rem;
            color: var(--text);
        }
        .redirect-card p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }

        .spinner-wrap { margin: 1.5rem 0 1rem; }
        .custom-spinner {
            width: 44px; height: 44px;
            border: 4px solid #e2e8ea;
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .progress-line {
            height: 4px;
            background: #e2e8ea;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-line::after {
            content: '';
            display: block; height: 100%;
            width: 30%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: slide 1.4s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .btn-manual {
            margin-top: 0.75rem;
            font-size: 0.88rem;
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
            border: 1px solid #e5e8eb;
            background: #f8fafb;
        }
        .btn-manual:hover { color: var(--primary-dark); border-color: var(--primary); background: #f0fdfa; }
    </style>

    <script language="JavaScript">
    <!--
        function startClock() {
            $(if popup == 'true')
                open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=320,height=480');
            $(endif)
            setTimeout(function() {
                location.href = './status';
            }, 2000);
        }
    //-->
    </script>
</head>
<body onLoad="startClock()">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>

    <div class="redirect-card">
        <div class="success-ring">
            <i class="fas fa-check success-icon"></i>
        </div>
        <h3>Connexion réussie !</h3>
        <p>Redirection vers votre espace...</p>

        <div class="progress-line"></div>
        <div class="spinner-wrap"><div class="custom-spinner"></div></div>

        <a href="./status" class="btn-manual">
            <i class="fas fa-arrow-right"></i> Cliquez ici si la page ne change pas
        </a>
    </div>

    <script type="text/javascript">
        document.getElementById('title').innerHTML = window.location.hostname + " > redirect";
    </script>
</body>
</html>
