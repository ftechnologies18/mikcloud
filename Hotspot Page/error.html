<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Erreur Hotspot</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width; initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-1: #0a1929; --bg-2: #102a43; --bg-3: #0d3b3e;
            --primary: #14b8a6; --primary-dark: #0d9488;
            --accent: #f59e0b; --accent-dark: #d97706;
            --danger: #ef4444; --danger-dark: #dc2626;
            --glass-bg: rgba(255,255,255,0.97);
            --text: #1f2937; --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow-x: hidden;
        }
        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(90px);
            opacity: 0.35; z-index: 0; pointer-events: none;
        }
        .bg-blob.b1 { width: 360px; height: 360px; background: var(--danger); top: -120px; left: -120px; animation: float1 14s ease-in-out infinite; }
        .bg-blob.b2 { width: 320px; height: 320px; background: var(--accent); bottom: -120px; right: -120px; animation: float2 16s ease-in-out infinite; }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,-30px); } }

        .error-container {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 22px;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            text-align: center;
            max-width: 440px; width: 90%;
            animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .error-icon-wrapper {
            width: 96px; height: 96px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--accent);
            box-shadow: 0 0 0 8px rgba(245,158,11,0.15), 0 10px 30px rgba(245,158,11,0.25);
            position: relative;
        }
        .error-icon-wrapper::before {
            content: '';
            position: absolute; inset: -6px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            opacity: 0.4;
            animation: ringPulse 2s ease-out infinite;
        }
        @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.4); opacity: 0; } }
        .error-icon { font-size: 2.8rem; color: var(--accent-dark); }

        .error-container h2 {
            margin: 0 0 0.5rem;
            font-weight: 800; font-size: 1.5rem;
        }
        .error-container > p {
            color: var(--text-muted);
            font-size: 0.92rem; margin: 0 0 1.5rem;
        }

        .error-message-box {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--danger);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex; align-items: flex-start; gap: 10px;
            text-align: left;
        }
        .error-message-box i { color: var(--danger); margin-top: 2px; flex-shrink: 0; }

        .btn-retry {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 13px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700; font-size: 1rem;
            transition: all 0.25s;
            box-shadow: 0 8px 22px rgba(20,184,166,0.35);
            width: 100%;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(20,184,166,0.5);
            color: #fff; text-decoration: none;
        }
        .btn-retry:active { transform: scale(0.98); }

        .help-row {
            display: flex; align-items: center; justify-content: center; gap: 16px;
            margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);
        }
        .help-row a {
            color: var(--primary-dark); text-decoration: none; font-weight: 600;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .help-row a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>

    <div class="error-container">
        <div class="error-icon-wrapper">
            <i class="fas fa-exclamation-triangle error-icon"></i>
        </div>

        <h2>Oups ! Une erreur est survenue</h2>
        <p>Veuillez vérifier vos identifiants ou contacter le support.</p>

        <div class="error-message-box">
            <i class="fas fa-info-circle"></i>
            <span>$(error)</span>
        </div>

        <a href="$(link-login)" class="btn-retry">
            <i class="fas fa-redo"></i> Réessayer
        </a>

        <div class="help-row">
            <span>Besoin d'aide ?</span>
            <a href="https://wa.me/2250150491807" target="_blank" rel="noopener">
                <i class="fab fa-whatsapp"></i> 01 5049 1807
            </a>
        </div>
    </div>
</body>
</html>
