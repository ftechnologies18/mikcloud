<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mnaspot — Bienvenue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>

    <style>
        :root {
            --bg-1: #0a1929; --bg-2: #102a43; --bg-3: #0d3b3e;
            --primary: #14b8a6; --primary-dark: #0d9488; --primary-light: #5eead4;
            --accent: #f59e0b; --accent-dark: #d97706;
            --success: #10b981;
            --glass-bg: rgba(255,255,255,0.97);
            --glass-border: rgba(255,255,255,0.18);
            --text: #1f2937; --text-muted: #6b7280;
            --radius: 22px;
            --shadow-lg: 0 25px 60px rgba(0,0,0,0.45);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow-x: hidden;
        }
        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(90px);
            opacity: 0.4; z-index: 0; pointer-events: none;
        }
        .bg-blob.b1 { width: 420px; height: 420px; background: var(--primary); top: -120px; left: -120px; animation: float1 14s ease-in-out infinite; }
        .bg-blob.b2 { width: 360px; height: 360px; background: var(--accent); bottom: -140px; right: -140px; animation: float2 16s ease-in-out infinite; }
        .bg-blob.b3 { width: 300px; height: 300px; background: var(--primary-light); top: 40%; right: -100px; opacity: 0.18; animation: float1 18s ease-in-out infinite reverse; }
        @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,40px) scale(1.1); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-30px) scale(1.05); } }

        .welcome-card {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%; max-width: 520px;
            padding: 3rem 2.25rem;
            text-align: center;
            animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .brand-badge {
            width: 92px; height: 92px;
            margin: 0 auto 1.5rem;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 28px rgba(20,184,166,0.4);
            position: relative;
        }
        .brand-badge::after {
            content: '';
            position: absolute; inset: -6px;
            border: 2px solid var(--primary);
            border-radius: 28px;
            opacity: 0.3;
            animation: ringPulse 2.4s ease-out infinite;
        }
        @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
        .brand-badge i { color: #fff; font-size: 2.6rem; }

        .brand-name {
            font-size: 1.75rem; font-weight: 900;
            margin: 0 0 0.5rem;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .typing-line {
            min-height: 1.6em;
            font-size: 1.2rem; font-weight: 700;
            color: var(--text);
            margin: 0.5rem 0 1.75rem;
            display: inline-block;
        }
        .typing-line .typed-cursor { color: var(--accent); font-weight: 400; }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 1.75rem 0;
        }
        .feature-item {
            padding: 16px 8px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f8fafb, #f1f5f9);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .feature-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(20,184,166,0.18);
        }
        .feature-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
            font-size: 1.1rem;
            color: #fff;
        }
        .fi-1 { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
        .fi-2 { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
        .fi-3 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .feature-title { font-size: 0.82rem; font-weight: 800; margin: 0; color: var(--text); }
        .feature-sub { font-size: 0.68rem; color: var(--text-muted); margin: 2px 0 0; }

        .btn-connect {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; border: none;
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 700; font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 22px rgba(20,184,166,0.35);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(20,184,166,0.5);
            color: #fff; text-decoration: none;
        }
        .btn-connect:active { transform: scale(0.98); }

        .footer-info {
            margin-top: 1.5rem;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .footer-info a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
        .footer-info a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .welcome-card { padding: 2.25rem 1.5rem; }
            .feature-grid { gap: 8px; }
            .feature-item { padding: 12px 4px; }
            .brand-name { font-size: 1.45rem; }
            .typing-line { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>

    <div class="welcome-card">
        <div class="brand-badge">
            <i class="fas fa-wifi"></i>
        </div>

        <h1 class="brand-name">Mnaspot</h1>

        <div class="typing-line"><span id="effet"></span></div>

        <div class="feature-grid">
            <div class="feature-item">
                <div class="feature-icon fi-1"><i class="fas fa-bolt"></i></div>
                <p class="feature-title">Haut débit</p>
                <p class="feature-sub">Connexion rapide</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon fi-2"><i class="fas fa-clock"></i></div>
                <p class="feature-title">24H / 24H</p>
                <p class="feature-sub">Toujours disponible</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon fi-3"><i class="fas fa-shield-alt"></i></div>
                <p class="feature-title">Sécurisé</p>
                <p class="feature-sub">Réseau protégé</p>
            </div>
        </div>

        <a href="$(link-login)" class="btn-connect">
            <i class="fas fa-arrow-right"></i> Se connecter
        </a>

        <div class="footer-info">
            Besoin d'aide ? <a href="https://wa.me/2250150491807" target="_blank" rel="noopener">01 5049 1807</a>
        </div>
    </div>

    <script>
        var typed2 = new Typed('#effet', {
            strings: ['Surfez avec une connexion haut débit !', '24H / 24H', 'Bienvenue chez Mnaspot'],
            typeSpeed: 50,
            backSpeed: 20,
            fadeOut: false,
            loop: true,
            backDelay: 1500
        });
    </script>
</body>
</html>
