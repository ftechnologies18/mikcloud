$(if http-status == 302)Hotspot login required$(endif)
$(if http-header == "Location")$(link-redirect)$(endif)
<html>
<!--
<?xml version="1.0" encoding="UTF-8"?>
  <WISPAccessGatewayParam
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:noNamespaceSchemaLocation="http://$(hostname)/xml/WISPAccessGatewayParam.xsd">
    <Redirect>
        <AccessProcedure>1.0</AccessProcedure>
        <AccessLocation>$(location-id)</AccessLocation>
        <LocationName>$(location-name)</LocationName>
        <LoginURL>$(link-login-only)?target=xml</LoginURL>
        <MessageType>100</MessageType>
        <ResponseCode>0</ResponseCode>
    </Redirect>
  </WISPAccessGatewayParam>
-->
<head>
<title>Connexion en cours...</title>
<meta http-equiv="refresh" content="0; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="viewport" content="width=device-width; initial-scale=1.0">
<style>
    :root {
        --bg-1: #0a1929; --bg-2: #102a43; --bg-3: #0d3b3e;
        --primary: #14b8a6;
        --text: #1f2937; --text-muted: #6b7280;
        --glass-bg: rgba(255,255,255,0.97);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
        color: var(--text);
        display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow: hidden;
    }
    .loader-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 22px;
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        text-align: center;
        max-width: 320px; width: 90%;
    }
    .spinner {
        width: 42px; height: 42px;
        border: 4px solid #e2e8ea;
        border-top: 4px solid var(--primary);
        border-right: 4px solid var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 1rem;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .status-text { font-weight: 700; font-size: 1rem; margin: 0 0 4px; }
    .sub-text { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
</style>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <div class="status-text">Connexion en cours...</div>
        <div class="sub-text">Redirection automatique</div>
    </div>
</body>
</html>
