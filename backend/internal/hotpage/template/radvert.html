<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Publicité requise</title>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width; initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); /* Fond chaud "Orange/Jaune" */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .advert-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .ad-icon {
            font-size: 4rem;
            color: #ffc107; /* Jaune or */
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h2 { margin-bottom: 15px; font-weight: 700; }
        
        p { color: #666; font-size: 1.1rem; margin-bottom: 30px; }

        .btn-ad {
            display: inline-block;
            background: #fd7e14; /* Orange */
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(253, 126, 20, 0.4);
            transition: all 0.3s;
            margin-bottom: 15px;
            width: 100%;
        }
        .btn-ad:hover {
            background: #e36a0b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(253, 126, 20, 0.6);
        }

        .small-link {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            text-decoration: underline;
            margin-top: 20px;
        }
        .small-link:hover { color: #666; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body onLoad="openAdvert()">

    <div class="advert-card">
        <div class="ad-icon">
            <i class="fas fa-bullhorn"></i>
        </div>
        <h2>Publicité Requise</h2>
        <p>Pour continuer à naviguer gratuitement, une publicité va s'ouvrir. Merci de votre soutien !</p>
        
        <!-- Bouton manuel si la popup ne s'ouvre pas -->
        <a href="$(link-redirect)" target="hotspot_advert" class="btn-ad">
            <i class="fas fa-external-link-alt"></i> Ouvrir la publicité
        </a>
        
        <!-- Lien de retour vers l'original -->
        <a href="$(link-orig)" class="small-link">
            Si rien ne se passe, cliquez ici pour continuer
        </a>
    </div>

    <script language="JavaScript">
    <!--
        var popup = '';
        function openOrig() {
            if (window.focus) popup.focus();
            location.href = unescape('$(link-orig-esc)');
        }
        function openAd() {
            location.href = unescape('$(link-redirect-esc)');
        }
        function openAdvert() {
            if (window.name != 'hotspot_advert') {
                popup = open('$(link-redirect)', 'hotspot_advert', '');
                setTimeout("openOrig()", 1000);
                return;
            }
            setTimeout("openAd()", 1000);
        }
    //-->
    </script>
</body>
</html>
