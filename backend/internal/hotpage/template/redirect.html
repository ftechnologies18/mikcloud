<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Préparation...</title>
    <meta http-equiv="refresh" content="0; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width; initial-scale=1.0">

    <style>
        :root {
            --bg-1: #0a1929; --bg-2: #102a43; --bg-3: #0d3b3e;
            --primary: #14b8a6; --primary-dark: #0d9488;
            --accent: #f59e0b;
            --glass-bg: rgba(255,255,255,0.97);
            --text: #1f2937; --text-muted: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        .bg-blob {
            position: fixed; border-radius: 50%; filter: blur(80px);
            opacity: 0.35; z-index: 0; pointer-events: none;
        }
        .bg-blob.b1 { width: 320px; height: 320px; background: var(--primary); top: -100px; left: -100px; animation: float1 14s ease-in-out infinite; }
        .bg-blob.b2 { width: 280px; height: 280px; background: var(--accent); bottom: -100px; right: -100px; animation: float2 16s ease-in-out infinite; }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,20px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-20px); } }

        .loading-container {
            position: relative; z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 22px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 340px; width: 90%;
            animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo-circle {
            width: 64px; height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 22px rgba(20,184,166,0.35);
            position: relative;
        }
        .logo-circle i {
            color: #fff; font-size: 1.8rem;
            animation: pulseIcon 2s ease-in-out infinite;
        }
        @keyframes pulseIcon {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.85; }
        }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid #e2e8ea;
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.25rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-text {
            color: var(--text); font-size: 1.05rem; font-weight: 700; margin: 0 0 4px;
        }
        .sub-text {
            color: var(--text-muted); font-size: 0.85rem; margin: 0;
        }

        .progress-line {
            height: 4px;
            background: #e2e8ea;
            border-radius: 4px;
            overflow: hidden;
            margin: 1.25rem 0 0.25rem;
        }
        .progress-line::after {
            content: '';
            display: block; height: 100%;
            width: 30%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: slide 1.4s ease-in-out infinite;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
    </style>
</head>
<body>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>

    <div class="loading-container">
        <div class="logo-circle"><i class="fas fa-wifi"></i></div>
        <div class="spinner"></div>
        <div class="status-text">Préparation de la connexion...</div>
        <div class="sub-text">Veuillez patienter</div>
        <div class="progress-line"></div>
    </div>

    <script language="JavaScript">
    <!--
        $(if http-status == 302)
            window.location.replace('$(link-redirect)');
        $(endif)
    //-->
    </script>
</body>
</html>
