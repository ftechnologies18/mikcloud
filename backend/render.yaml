# Déploiement Render — MikCloud Hotspot API
# https://render.com/docs/deploy-go
services:
  - type: web
    name: mikcloud-api
    runtime: go
    plan: free
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /
    envVars:
      - key: GO_VERSION
        value: 1.25.14
      - key: JWT_SECRET
        generateValue: true
      # URL de connexion Neon (postgresql://…), à coller dans le dashboard
      # Render → Environment → Add environment variable (secret, jamais commité).
      - key: DATABASE_URL
        sync: false
      # Identifiants admin de production (optionnel mais vivement conseillé) :
      # sans eux, le compte démo admin/admin123 reste actif.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # CORS — origines autorisées, séparées par des virgules. Requis UNIQUEMENT
      # en mode direct (NEXT_PUBLIC_API_BASE côté Vercel). Avec le proxy
      # vercel.json (recommandé), laisser vide.
      # Ex. : https://mikcloud.ftci.fr,https://mikcloud.vercel.app
      - key: ALLOWED_ORIGIN
        sync: false
# Les données vivent dans Neon (PostgreSQL) : le disque éphémère du plan
# gratuit Render n'est plus un problème — l'état est rechargé à chaque
# démarrage et synchronisé à chaque modification.
