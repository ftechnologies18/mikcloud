# Déploiement Render — MikCloud Hotspot API
# https://render.com/docs/deploy-go
services:
  - type: web
    name: mikcloud-api
    runtime: go
    plan: free
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /
    envVars:
      - key: GO_VERSION
        value: 1.27.1
      - key: JWT_SECRET
        generateValue: true
      # URL de connexion Neon (postgresql://…), à coller dans le dashboard
      # Render → Environment → Add environment variable (secret, jamais commité).
      - key: DATABASE_URL
        sync: false
      # Sécurité P0 — ADMIN_PASSWORD est OBLIGATOIRE sur une base PostgreSQL
      # vide : sans elle, le service REFUSE de démarrer (bootstrapAdmin).
      # Plus aucun identifiant par défaut connu du repo n'existe dans le code.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # CORS — origines autorisées, séparées par des virgules. Requis en mode
      # direct (NEXT_PUBLIC_API_BASE côté Vercel — configuration active).
      # Avec le proxy vercel.json (alternative), laisser vide.
      # Ex. : https://mikcloud.ftci.fr,https://mikcloud.vercel.app
      - key: ALLOWED_ORIGIN
        sync: false
      # N°46 — origine publique du frontend Vercel : sert à construire les
      # liens absolus /join/{token} et /wifi/{slug} exposés au portail captif
      # (buildPortalConfig → publicFrontendURL). Sans elle, cfg.joinUrl reste
      # vide et le bouton « S'inscrire » du portail ne peut jamais s'afficher.
      - key: APP_PUBLIC_URL
        value: https://mikcloud.ftci.fr
# Les données vivent dans Neon (PostgreSQL) : le disque éphémère du plan
# gratuit Render n'est plus un problème — l'état est rechargé à chaque
# démarrage et synchronisé à chaque modification.
